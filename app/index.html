<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#DA291C">
<title>麦麦批准 · 今天这顿，麦当劳批了</title>
<style>
  :root {
    --red: #DA291C;
    --red-dark: #A8170D;
    --red-hi: #F2483A;
    --yellow: #FFC72C;
    --gold: #C9A227;
    --paper: #FFF9EE;
    --ink: #1D1D1F;
    --ink-soft: #6E6259;
    --line: #E8DCC6;
    --green: #1D9E75;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sheet: cubic-bezier(.32, .72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* html 也要 hidden：否则 body 的 overflow 会转交给视口，藏在屏幕下方的抽屉撑出滚动区，
     输入框聚焦时整页被滚走露出黑边。body 用 clip（不可被程序滚动），hidden 兜底老浏览器 */
  html { height: 100%; overflow: hidden; background: #111; }
  body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--red-dark); color: var(--ink);
    max-width: 430px; margin: 0 auto;
    overflow: hidden; overflow: clip; position: relative;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  .red-bg { background: radial-gradient(130% 70% at 50% 0%, var(--red-hi) 0%, var(--red) 42%, var(--red-dark) 100%); }
  .stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transform: translateY(12px) scale(.985);
    transition: opacity .26s ease, transform .26s var(--sheet);
  }
  .stage.on { opacity: 1; pointer-events: auto; transform: none; }
  .back {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 50;
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.18);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; font-size: 18px; display: none; align-items: center; justify-content: center;
  }
  .dots { position: absolute; top: max(24px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 7px; z-index: 50; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35); transition: all .3s; }
  .dots i.on { background: var(--yellow); width: 20px; border-radius: 4px; }

  /* ===== iOS 按压反馈 ===== */
  .chip, .back, .submit, .order-btn, .cta-row button, .replay button {
    transition: transform .14s var(--spring), filter .14s ease, opacity .2s ease, background .2s, color .2s, border-color .2s;
  }
  .chip:active, .back:active, .cta-row button:active, .replay button:active { transform: scale(.94); }
  .submit:active, .order-btn:active { transform: scale(.97); filter: brightness(.95); }

  /* ===== Stage 1 犒劳申请单 ===== */
  #st-ask { color: #fff; overflow-y: auto; padding-top: max(40px, env(safe-area-inset-top)); }
  .ask-top { padding: 0 26px 18px; }
  .ask-kicker { font-size: 12px; letter-spacing: 3px; color: var(--yellow); font-weight: 800; }
  .ask-date { font-size: 13px; font-weight: 600; opacity: .8; margin-top: 14px; }
  .ask-time { font-size: 54px; font-weight: 800; letter-spacing: -1px; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .ask-greet { font-size: 19px; font-weight: 700; margin-top: 10px; line-height: 1.45; }
  .form {
    flex: 1; background: var(--paper); color: var(--ink);
    border-radius: 24px 24px 0 0; padding: 18px 22px max(16px, env(safe-area-inset-bottom));
    box-shadow: 0 -12px 30px rgba(0,0,0,.18);
  }
  #st-ask.on .form { animation: formUp .55s var(--sheet) .05s both; }
  @keyframes formUp { from { transform: translateY(70px); opacity: 0; } }
  .form-head { display: flex; justify-content: space-between; align-items: baseline; padding-bottom: 11px; border-bottom: 1.5px dashed rgba(218,41,28,.35); }
  .form-head b { font-size: 18px; color: var(--red); letter-spacing: 3px; font-weight: 900; }
  .form-head span { font-size: 10px; color: var(--ink-soft); letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .form-label { font-size: 12px; font-weight: 800; color: var(--ink-soft); margin: 14px 0 9px; letter-spacing: 1px; }
  .form-label small { font-weight: 600; margin-left: 6px; opacity: .7; letter-spacing: 0; }
  .form-label small.warn { color: var(--red); opacity: 1; }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; }
  .chip {
    border: 1.5px solid var(--line); background: #fff; border-radius: 999px;
    padding: 7px 12px; font-size: 14px; font-weight: 700; color: var(--ink);
  }
  .chip.on { background: var(--red); border-color: var(--red); color: #fff; box-shadow: 0 4px 10px rgba(218,41,28,.28); }
  .form-input {
    display: block; width: 100%; margin-top: 10px; border: none; border-bottom: 1.5px solid var(--line);
    background: transparent; padding: 9px 2px; font-size: 16px; font-family: inherit; color: var(--ink);
    outline: none; border-radius: 0;
    user-select: text; -webkit-user-select: text; /* iOS：父级禁选会导致输入框打不了字 */
  }
  .form-input:focus { border-bottom-color: var(--red); }
  .submit {
    display: block; width: 100%; margin-top: 20px; padding: 16px; border: none; border-radius: 16px;
    background: var(--red); color: #fff; font-size: 17px; font-weight: 800; letter-spacing: 3px;
    box-shadow: 0 8px 18px rgba(218,41,28,.32);
  }
  /* 小屏：提交按钮吸底，主操作永远看得见；开屏区压缩 */
  .submit { position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 2; }
  @media (max-height: 700px) {
    .ask-date { margin-top: 8px; }
    .ask-time { font-size: 42px; }
    .ask-greet { font-size: 17px; margin-top: 6px; }
    .ask-top { padding-bottom: 14px; }
    .form-label { margin: 10px 0 8px; }
    .submit { margin-top: 14px; }
  }
  .shake-x { animation: shakeX .36s ease; }
  @keyframes shakeX { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .foot-note { text-align: center; font-size: 10px; color: #B4A795; margin-top: 14px; }

  /* ===== Stage 2 批准书 ===== */
  #st-approve { align-items: center; padding: 56px 16px max(16px, env(safe-area-inset-bottom)); overflow-x: hidden; overflow-y: auto; }
  /* 放射光：收在 inset:0 的图层里裁切，避免 900px 大圆撑出滚动区 */
  .burst-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .burst {
    --burst: rgba(255,199,44,.3);
    position: absolute; left: 50%; top: 46%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
    background: repeating-conic-gradient(var(--burst) 0deg 9deg, transparent 9deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%); mask-image: radial-gradient(circle, #000 0%, transparent 62%);
    opacity: 0; transition: opacity .7s ease; animation: spin 30s linear infinite;
  }
  #st-approve.won .burst { opacity: 1; }
  #st-approve.gold .burst { --burst: rgba(255,226,140,.55); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cert-wrap { position: relative; z-index: 1; width: 100%; max-width: 380px; flex-shrink: 0; transform: translateY(50px) rotate(-2deg); opacity: 0; }
  #st-approve.on .cert-wrap { animation: certIn .55s var(--sheet) .05s forwards; }
  @keyframes certIn { to { transform: none; opacity: 1; } }
  .cert { position: relative; background: var(--paper); border-radius: 10px; padding: 22px 22px 14px; box-shadow: 0 18px 40px rgba(0,0,0,.28); }
  .cert::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(218,41,28,.3); border-radius: 5px; pointer-events: none; }
  .cert.shake { animation: certShake .3s ease; }
  @keyframes certShake { 30% { transform: translateY(4px) rotate(-.5deg); } 60% { transform: translateY(-1px) rotate(.25deg); } }
  .cert-head { text-align: center; }
  .cert-head .t { font-size: 22px; font-weight: 900; letter-spacing: 4px; color: var(--red); }
  .cert-head .no { font-size: 10px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .cert-gold {
    display: none; margin-top: 8px; padding: 4px 0; font-size: 12px; font-weight: 900; color: #9A7000; letter-spacing: 2px;
    background: linear-gradient(90deg, transparent, #FFE9A8 20%, #FFE9A8 80%, transparent);
  }
  .cert.gold .cert-gold { display: block; }
  .cert dl { margin-top: 6px; }
  .cert-row { display: flex; gap: 10px; font-size: 13px; line-height: 1.5; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .cert-row dt { color: var(--ink-soft); flex-shrink: 0; width: 60px; }
  .cert-row dd { font-weight: 700; flex: 1; word-break: break-all; }
  .cert-row .stars { color: var(--red); letter-spacing: 2px; }
  .cert-verdict { margin-top: 12px; padding: 9px 14px 11px; background: #fff; border-radius: 12px; box-shadow: inset 0 0 0 1px #F0E3CB; text-align: center; }
  .cert-verdict small { display: block; font-size: 10px; color: var(--ink-soft); letter-spacing: 2px; font-weight: 700; }
  .cert-verdict p { font-size: 15px; font-weight: 800; margin-top: 3px; min-height: 23px; }
  .cert-verdict p.pending { color: var(--ink-soft); font-weight: 600; animation: pulse 1s ease infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .cert-food { display: flex; align-items: flex-end; justify-content: center; margin-top: 10px; min-height: 172px; }
  .cert-food .photo-a { width: 236px; }
  .cert-food .photo-b { width: 164px; margin-left: -96px; }
  .cert-food .photo-a:only-child { width: 260px; }
  .mystery {
    width: 132px; height: 132px; border-radius: 50%; border: 2px dashed rgba(218,41,28,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: rgba(218,41,28,.7); animation: breathe 1.1s ease-in-out infinite;
  }
  .mystery b { font-size: 46px; line-height: 1; font-weight: 900; }
  .mystery small { font-size: 11px; margin-top: 4px; font-weight: 800; letter-spacing: 2px; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  /* 揭晓：食物从"?"里蹦出来 + 金光 */
  .cert-food.reveal > div { animation: foodPop .65s var(--spring) both; }
  .cert-food.reveal .photo-b { animation-delay: .12s; }
  @keyframes foodPop { from { opacity: 0; transform: translateY(30px) scale(.2) rotate(-25deg); } to { opacity: 1; transform: translateY(var(--y, 0)) rotate(var(--r)); } }
  /* 揭晓金光：同样是 5 层 filter，和常态逐层插值过渡 */
  .cert-food.reveal .stk img, .cert-food.reveal .stk svg { animation: glow 1.4s ease-out; }
  @keyframes glow { 0%, 30% { filter: var(--stk) drop-shadow(0 0 24px rgba(255,199,44,1)); } }
  .cert-meal-label { text-align: center; font-size: 11px; color: var(--red); font-weight: 800; letter-spacing: 3px; margin-top: 12px; }
  .cert-meal { text-align: center; font-size: 17px; font-weight: 900; margin-top: 2px; }
  .cert-meal.muted { font-size: 14px; font-weight: 600; color: var(--ink-soft); }
  .cert-meta { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 3px; min-height: 16px; }
  .cert-sign { font-size: 11px; color: var(--ink-soft); margin-top: 12px; padding-top: 9px; border-top: 1px dashed var(--line); }
  .cert-src { text-align: center; font-size: 9px; color: #B4A795; margin-top: 8px; letter-spacing: .5px; }
  .stamp {
    position: absolute; right: 10px; top: 50px; width: 128px; height: 128px; border-radius: 50%;
    border: 4px solid var(--red); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 7px var(--red);
    color: var(--red); display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transform: rotate(-16deg) scale(3); mix-blend-mode: multiply; pointer-events: none;
  }
  .stamp b { font-size: 30px; font-weight: 900; letter-spacing: 3px; line-height: 1.05; text-align: center; }
  .stamp small { font-size: 9px; font-weight: 800; margin-top: 4px; }
  .stamp.hit { animation: stampHit .3s cubic-bezier(.5, 0, .75, 0) forwards; }
  @keyframes stampHit {
    0%   { opacity: 0; transform: rotate(-16deg) scale(3); }
    60%  { opacity: .95; }
    100% { opacity: .9; transform: rotate(-16deg) scale(1); }
  }
  .stamp::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid currentColor; opacity: 0; }
  .stamp.hit::after { animation: inkRing .5s ease-out .3s; }
  @keyframes inkRing { from { opacity: .6; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
  .cert.gold .stamp { color: #B8860B; border-color: var(--gold); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 7px var(--gold); }
  .approve-cta {
    position: relative; z-index: 1; width: 100%; max-width: 380px; flex-shrink: 0;
    opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .3s, transform .3s var(--sheet);
  }
  .approve-cta.on { opacity: 1; transform: none; pointer-events: auto; }
  .approve-cta .order-btn { margin-top: 16px; }
  .cta-row { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 10px; color: rgba(255,255,255,.5); font-size: 13px; }
  .cta-row button { border: none; background: none; color: #fff; font-size: 14px; font-weight: 700; padding: 6px 8px; }

  /* ===== 沿食物轮廓的白边贴纸（批准书 + 领券抽屉共用）=====
     菜单图是透明底抠图：四个方向各叠一层白色实心投影 = 沿轮廓长出白边，再加一层软阴影做"贴纸翘起"。
     主食在前、配餐在后并抬高，叠出层次。 */
  .photo-a, .photo-b { position: relative; transform: translateY(var(--y, 0)) rotate(var(--r)); flex-shrink: 0; }
  .photo-a { --r: -6deg; z-index: 2; }
  .photo-b { --r: 8deg; --y: -18px; z-index: 1; }
  .stk {
    --stk: drop-shadow(5px 0 0 #fff) drop-shadow(-5px 0 0 #fff) drop-shadow(0 5px 0 #fff) drop-shadow(0 -5px 0 #fff);
  }
  .stk img, .stk svg { display: block; width: 100%; height: auto; filter: var(--stk) drop-shadow(0 12px 14px rgba(0,0,0,.26)); }
  .stk svg { width: 66%; margin: 6% auto 0; } /* 兜底插画是方图、无留白，缩到和横版抠图视觉等大 */

  /* ===== 庆祝层：底部烟花 + 顶部彩纸（纯 CSS）===== */
  /* absolute 而非 fixed：约束在 430px 机身内，桌面宽屏不放飞 */
  .fw-layer { position: absolute; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
  .fw-burst {
    position: absolute; bottom: -12px; left: 50%; width: 0; height: 0;
    animation: fwRise .55s cubic-bezier(.18,.72,.3,1) forwards;
  }
  @keyframes fwRise { to { transform: translateY(calc(-1 * var(--peak, 46vh))); } }
  .fw-burst i {
    position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
    opacity: 0; animation: fwSpark .85s ease-out forwards;
  }
  @keyframes fwSpark {
    0%   { opacity: 1; transform: translate(0, 0) scale(1.2); }
    70%  { opacity: .9; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.25); }
  }
  .cf { position: absolute; top: -16px; width: 8px; height: 14px; border-radius: 2px; animation: cfFall linear forwards; }
  @keyframes cfFall { to { transform: translate(var(--x), 110vh) rotate(var(--rot)); } }

  /* ===== 领券抽屉 ===== */
  #st-deal { justify-content: flex-end; z-index: 60; }
  #st-deal .underlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .3s; }
  #st-deal.on .underlay { opacity: 1; }
  .sheet {
    position: relative; background: #F5F5F7; border-radius: 26px 26px 0 0;
    padding: 12px 24px max(30px, env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .42s var(--sheet);
    max-height: 86%; overflow-y: auto;
  }
  #st-deal.on .sheet { transform: translateY(0); }
  .grabber { width: 38px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.15); margin: 4px auto 18px; }
  .sheet h2 { font-size: 24px; font-weight: 800; }
  .sheet .sub2 { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .deal-food { display: flex; align-items: flex-end; justify-content: center; margin-top: 14px; }
  .deal-food .photo-a { width: 230px; }
  .deal-food .photo-b { width: 160px; margin-left: -92px; }
  .deal-food .photo-a:only-child { width: 250px; }
  .coupon-row { display: flex; gap: 10px; margin-top: 18px; overflow-x: auto; padding-bottom: 4px; }
  .coupon {
    flex-shrink: 0; background: #FFF4D6; border: 1.5px dashed #E8B93B; border-radius: 12px;
    padding: 10px 14px; font-size: 12px; font-weight: 700; color: #7A5B0B;
  }
  .price-line { display: flex; align-items: baseline; gap: 10px; margin-top: 18px; }
  .price-line .now { font-size: 34px; font-weight: 800; color: var(--red); }
  .price-line .was { font-size: 14px; color: var(--ink-soft); text-decoration: line-through; }
  .price-line .save { font-size: 12px; font-weight: 800; color: var(--green); }
  .order-btn {
    display: block; width: 100%; margin-top: 18px; padding: 17px; border: none;
    background: var(--yellow); color: var(--ink); font-size: 17px; font-weight: 800;
    border-radius: 16px; letter-spacing: 1px;
  }
  .share-line { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 14px; }
  .star-link { display: block; text-align: center; font-size: 13px; font-weight: 700; color: var(--ink); margin-top: 10px; text-decoration: none; }
  .replay { text-align: center; margin-top: 10px; }
  .replay button { border: none; background: none; color: var(--ink-soft); font-size: 13px; text-decoration: underline; padding: 6px; }
</style>
</head>
<body>

<div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
<button class="back" id="backBtn" aria-label="返回">‹</button>
<div class="fw-layer" id="fwLayer"></div>

<!-- Stage 1：犒劳申请单 -->
<section class="stage red-bg on" id="st-ask">
  <div class="ask-top">
    <div class="ask-kicker">麦麦批准处 · 犒劳申请</div>
    <div class="ask-date" id="askDate"></div>
    <div class="ask-time" id="askTime"></div>
    <div class="ask-greet" id="askGreet"></div>
  </div>
  <div class="form">
    <div class="form-head"><b>犒劳申请单</b><span id="formNo"></span></div>
    <div id="reasonZone">
      <div class="form-label">申请事由<small id="reasonHint">选一个，或自己写</small></div>
      <div class="chips" id="evChips"></div>
      <input class="form-input" id="sayText" maxlength="40" placeholder="自己写：今天……" enterkeyhint="done" aria-label="自己写申请事由">
    </div>
    <div class="form-label">想吃点</div>
    <div class="chips" id="tasteChips"></div>
    <button class="submit" id="submitBtn">提交申请</button>
    <div class="foot-note">非官方粉丝作品 · 与金拱门（中国）无关</div>
  </div>
</section>

<!-- Stage 2：批准书 -->
<section class="stage red-bg" id="st-approve">
  <div class="burst-layer"><div class="burst"></div></div>
  <div class="cert-wrap">
    <div class="cert" id="cert">
      <div class="cert-head">
        <div class="t">麦麦犒劳批准书</div>
        <div class="no" id="certNo"></div>
        <div class="cert-gold">★ 金章特批 · 今日限定 ★</div>
      </div>
      <dl>
        <div class="cert-row"><dt>申请事由</dt><dd id="certReason"></dd></div>
        <div class="cert-row"><dt>犒劳指数</dt><dd class="stars" id="certStars"></dd></div>
        <div class="cert-row" id="tasteRow"><dt>口味偏好</dt><dd id="certTaste"></dd></div>
      </dl>
      <div class="cert-verdict"><small>审批意见</small><p id="certVerdict"></p></div>
      <div class="cert-food" id="certFood"></div>
      <div class="cert-meal-label" id="certMealLabel"></div>
      <div class="cert-meal" id="certMeal"></div>
      <div class="cert-meta" id="certMeta"></div>
      <div class="cert-sign">审批：麦麦批准处</div>
      <div class="cert-src">麦麦批准 McApproved · github.com/pakco77/mctrack</div>
      <div class="stamp" id="stamp"><b id="stampText"></b><small id="stampDate"></small></div>
    </div>
  </div>
  <div class="approve-cta" id="approveCta">
    <button class="order-btn" id="goDeal">领券去吃 →</button>
    <div class="cta-row"><button id="swapBtn">不爱吃？换一个</button><span id="swapDot">·</span><button id="againBtn">重新申请</button></div>
  </div>
</section>

<!-- Stage 3：领券下单 -->
<section class="stage" id="st-deal">
  <div class="underlay" id="dealUnderlay"></div>

const COMBOS = {
  burger:  { 1: [["mcChicken"], ["fries"]], 2: [["mcChicken", "coffee"], ["filet", "coffee"]], 3: [["doubleCheese", "coke"], ["bigmac", "coffee"], ["mcChicken", "fries"]], 4: [["bigmac", "fries"], ["doubleCheese", "fries"]] },

  spicy:   { 1: [["wings"]], 2: [["wings", "coke"], ["mcSpicy"]], 3: [["mcSpicy", "coke"], ["wings", "fries"]], 4: [["mcSpicy", "fries"], ["mcSpicy", "wings"]] },
  sweet:   { 1: [["cone"], ["sundae"]], 2: [["flurry", "coffee"], ["sundae", "coffee"]], 3: [["nuggets", "flurry"], ["mcChicken", "sundae"]], 4: [["doubleCheese", "sundae"], ["mcSpicy", "flurry"]] },

/* 选了口味：先轮完该口味的候选，再顺延到同档位的其他餐，"换一个"永远换得动 */
function candidates(ev, taste) {
  const all = [ev.meal].concat(...Object.values(COMBOS).map(c => c[ev.level]));
  const pool = taste === "any" ? all : COMBOS[taste][ev.level].concat(all);
  const seen = new Set();
  return pool.filter(m => { const k = m.join("+"); if (seen.has(k)) return false; seen.add(k); return true; });
}

/* 一句话 → 事件：按序关键词命中。顺序即优先级——"加班被骂"算被骂，"面试挂了"算 emo 不算搞定。
   ponytail: 关键词表，够图一乐；Skill 版由 WorkBuddy 的大模型理解原话后直接注入 eventId。 */
const EVENT_RULES = [
  ["scolded", /骂|批评|挨|背锅|委屈|吵架|被怼|返工|甲方/],
  ["emo",     /挂了|没过|失败|被拒|落榜|分手|失恋/],

  ["payday",  /工资|发薪|奖金|年终|到账|涨薪/],
  ["workout", /跑步|健身|运动|游泳|骑行|打球|公里|撸铁|瑜伽|爬山/],

  ["emo",     /emo|难过|伤心|想哭|丧|焦虑|烦|孤独|累/i],
  ["nothing", /没干|无聊|想吃|馋|没事/]
];
function matchEvent(text) {
  for (const [id, re] of EVENT_RULES) if (re.test(text)) return id;
  return "misc";
}

/* 开屏问候：只用本机时间，不要任何权限，让第一句话就是在说"此刻的你" */
function greet(d) {
  const h = d.getHours(), w = d.getDay(), fri = w === 5, weekend = w === 0 || w === 6;
  const time = String(h).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const line =
    h < 5  ? "还醒着的人，今天一定不容易" :
    h < 10 ? (w === 1 ? "周一早上，先活下来再说" : "起这么早，值得一顿好的") :
    h < 14 ? "上午辛苦了，午饭得像样点" :
    h < 18 ? (fri ? "周五下午，心已经下班了" : weekend ? "周末下午，吃点好的不用理由" : "下午最难熬，撑住") :
    h < 22 ? (fri ? "周五晚上，这周辛苦了" : "下班了吗？今天过得怎么样") :
             "一天快过完了，给它一个交代";
  return { time, line };
}
/* @pure-end */

function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h; }
function todayStr() { const d = new Date(); return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0"); }
/* 触感反馈：支持的设备上点按给一点震动，不支持就静默跳过 */
function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }
/* 音效：Web Audio 合成，无音频文件。iOS 不支持震动，靠声音给反馈。
   AudioContext 必须在用户点按时创建/唤醒（unlockAudio），否则 Safari 静音。 */
let actx = null;
function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function tone(f, { type = "sine", at = 0, dur = .2, vol = .5, to } = {}) {
  if (!actx || actx.state !== "running") return;
  const t = actx.currentTime + at, o = actx.createOscillator(), g = actx.createGain();
  o.type = type;
  o.frequency.setValueAtTime(f, t);
  if (to) o.frequency.exponentialRampToValueAtTime(to, t + dur * .75);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(.001, t + dur);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + dur + .02);
}

/* ---------- 舞台机 ---------- */
const ORDER = ["ask", "approve", "deal"];
function goTo(name) {
  stage = name;
  ORDER.forEach(s => $("st-" + s).classList.toggle("on", s === name || (name === "deal" && s === "approve")));
  const idx = ORDER.indexOf(name);
  document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("on", i <= idx));
  $("backBtn").style.display = name === "approve" ? "flex" : "none";
}
function toAsk() { seq.forEach(clearTimeout); seq = []; goTo("ask"); }
$("backBtn").onclick = () => { buzz(8); toAsk(); };

/* ---------- Stage 1：犒劳申请单 ---------- */
function chip(label, on, onClick) {
  const b = document.createElement("button");
  b.className = "chip" + (on ? " on" : "");
  b.textContent = label;
  b.onclick = () => { buzz(8); onClick(b); };
  return b;
}
function buildAsk() {
  const now = new Date(), g = greet(now);
  $("askDate").textContent = "周" + "日一二三四五六"[now.getDay()] + " · " + (now.getMonth() + 1) + "月" + now.getDate() + "日";
  $("askTime").textContent = g.time;
  $("askGreet").textContent = g.line;
  $("formNo").textContent = "No." + todayStr();
  const evBox = $("evChips"), tBox = $("tasteChips");
  EVENTS.forEach(ev => evBox.appendChild(chip(ev.emo + " " + ev.label, false, b => {
    const on = !b.classList.contains("on");
    evBox.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    b.classList.toggle("on", on);
    pickEv = on ? ev : null;
    if (on) $("sayText").value = "";
  })));
  TASTES.forEach(t => tBox.appendChild(chip(t.emo + " " + t.label, t.id === pickTaste, b => {
    tBox.querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
    b.classList.add("on");
    pickTaste = t.id;
  })));
}
/* 自己写和选卡片二选一：开始打字就取消卡片 */
$("sayText").oninput = () => {
  if (!$("sayText").value.trim()) return;
  pickEv = null;
  $("evChips").querySelectorAll(".chip").forEach(x => x.classList.remove("on"));
};
function submit() {
  const t = $("sayText").value.trim();
  if (!pickEv && !t) {
    buzz([30, 40, 30]);
    const z = $("reasonZone");
    z.classList.remove("shake-x"); void z.offsetWidth; z.classList.add("shake-x");
    $("reasonHint").textContent = "先选一个，或者自己写一句";
    $("reasonHint").classList.add("warn");
    return;
  }
  buzz(12);
  unlockAudio();
  $("sayText").blur();
  window.scrollTo(0, 0); /* iOS 收起键盘后页面偶尔不复位 */
  if (pickEv) approve(pickEv, pickEv.label, pickTaste);
  else approve(EVENTS.find(e => e.id === matchEvent(t)) || EVENT_MISC, "「" + t + "」", pickTaste);
}
$("submitBtn").onclick = submit;
$("sayText").onkeydown = e => { if (e.key === "Enter") submit(); };

/* ---------- Stage 2：批准书 ---------- */
/* 菜单图预加载：开屏就拉全部图，3s 还没到的记为失败，揭晓时直接用插画——高光时刻别露空白 */
const imgState = {};
function preload(items) {
  items.forEach(x => {
    if (!x.img || imgState[x.img]) return;
    imgState[x.img] = "wait";
    const i = new Image();
    i.onload = () => { imgState[x.img] = "ok"; };
    i.onerror = () => { imgState[x.img] = "fail"; };
    i.src = x.img;
    setTimeout(() => { if (imgState[x.img] === "wait") imgState[x.img] = "fail"; }, 3000);
  });
}
function photoHTML(item, cls) {
  const inner = item.img && imgState[item.img] !== "fail"
    ? '<img src="' + item.img + '" alt="' + item.name + '" data-k="' + (item.k || "burger") + '" onerror="window.__svgFallback(this)">'
    : artOf(item.k);
  return '<div class="' + cls + '"><div class="stk">' + inner + "</div></div>";
}
function artOf(k) { return (ART[MEAL_ART[k] || k] || ART.burger)(); }
window.__svgFallback = function (imgEl) {
  const f = imgEl.parentNode;
  if (f) f.innerHTML = artOf(imgEl.dataset.k);
};
/* 菜单图 CDN 偶尔会"卡住"（既不成功也不报错，onerror 不触发），2.5s 没出图就换插画，别留空白圆框 */
function fillFood(box, html) {
  box.innerHTML = html;
  const imgs = [...box.querySelectorAll("img")];
  setTimeout(() => imgs.forEach(i => { if (i.isConnected && !i.naturalWidth) window.__svgFallback(i); }), 2500);
}

/* 时序：批准书滑入（食物位是"?"）→ 审批意见逐字打出 → 落章砸中（震屏+闷响）→ 揭晓食物（放射光+彩纸+烟花+叮咚）→ 出按钮 */
function approve(ev, reason, taste) {
  seq.forEach(clearTimeout); seq = [];
  /* Skill 注入的实时菜单与券后价只给注入的那个事件用，且不提供"换一个"（换餐在 WorkBuddy 里说） */
  const inj = !!(D && D.eventId === ev.id && D.meals && D.meals.length);
  cands = inj ? [D.meals.slice(0, 2)] : candidates(ev, taste).map(m => m.map(k => FOOD_DB.find(f => f.k === k)));
  ci = 0;
  /* 金章特批：约 1/6，同一天同一事由结果固定（刷新刷不出来，才有炫耀价值） */
  const gold = hashStr(todayStr() + reason + ev.id) % 6 === 0;
  const d = new Date(), dateStr = d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate();
  const tt = TASTES.find(x => x.id === taste && x.id !== "any");

  $("cert").className = "cert" + (gold ? " gold" : "");
  $("st-approve").classList.toggle("gold", gold);
  $("st-approve").classList.remove("won");
  $("certNo").textContent = "No." + todayStr() + "-" + (hashStr(ev.id + reason) % 9000 + 1000);
  $("certReason").textContent = reason;
  $("certStars").textContent = "★".repeat(ev.level) + "☆".repeat(5 - ev.level);
  $("tasteRow").style.display = tt ? "" : "none";
  $("certTaste").textContent = tt ? tt.emo + " " + tt.label : "";
  $("certVerdict").className = "pending";
  $("certVerdict").textContent = "审批中…";
  $("certFood").className = "cert-food";
  $("certFood").innerHTML = '<div class="mystery"><b>?</b><small>待批准</small></div>';
  $("certMealLabel").textContent = "批准餐品";
  $("certMeal").className = "cert-meal muted";
  $("certMeal").textContent = "审批后揭晓";
  $("certMeta").textContent = "";
  $("stampText").innerHTML = gold ? "麦麦<br>特批" : "麦麦<br>批准";
  $("stampDate").textContent = dateStr;
  $("stamp").classList.remove("hit");
  $("approveCta").classList.remove("on");
  $("swapBtn").style.display = $("swapDot").style.display = cands.length > 1 ? "" : "none";
  goTo("approve");

  const tStamp = typeVerdict("「" + ((inj && D.verdict) || ev.verdict) + "」", 650) + 220;
  seq.push(setTimeout(() => $("stamp").classList.add("hit"), tStamp));
  seq.push(setTimeout(() => { $("cert").classList.add("shake"); tone(140, { to: 40, dur: .22, vol: .8 }); buzz(25); }, tStamp + 300));
  seq.push(setTimeout(() => reveal(inj, gold), tStamp + 650));
  seq.push(setTimeout(() => $("approveCta").classList.add("on"), tStamp + 1250));
}
/* 审批意见逐字打出，配极轻的打字声；返回打完的时间点 */
function typeVerdict(text, start) {
  const el = $("certVerdict"), chars = [...text];
  seq.push(setTimeout(() => { el.className = ""; el.textContent = ""; }, start));
  chars.forEach((ch, i) => seq.push(setTimeout(() => {
    el.textContent += ch;
    if (i % 2 === 0) tone(1800, { type: "square", dur: .02, vol: .03 });
  }, start + 40 + i * 55)));
  return start + 40 + chars.length * 55;
}
function reveal(inj, gold) {
  showMeal(inj);
  $("st-approve").classList.add("won");
  const colors = gold ? ["#C9A227", "#FFE08A", "#FFF4C2", "#FFFFFF"] : ["#FFC72C", "#FFFFFF", "#FF7A59", "#FFE08A"];
  confetti(colors);
  launchFireworks(colors);
  tone(784, { type: "triangle", dur: .5, vol: .22 });
  tone(1175, { type: "triangle", at: .09, dur: .6, vol: .22 });
  if (gold) tone(1568, { type: "triangle", at: .18, dur: .8, vol: .2 });
  buzz([12, 60, 12, 60, 30]);
}
function showMeal(inj) {
  const items = cands[ci];
  const base = items.reduce((s, x) => s + (x.price || 0), 0);
  cur = {
    items,
    names: items.map(x => x.name).join(" + "),
    price: inj && D.finalPrice != null ? D.finalPrice : base,
    kcal: items.every(x => x.kcal != null) ? items.reduce((s, x) => s + x.kcal, 0) : null,
    saved: inj ? D.saved || 0 : 0,
    coupons: inj ? D.couponCount || 0 : 0,
    realMenu: inj && !!D.realMenu
  };
  const box = $("certFood");
  box.className = "cert-food reveal";
  fillFood(box, photoHTML(items[0], "photo-a") + (items[1] ? photoHTML(items[1], "photo-b") : ""));
  $("certMealLabel").textContent = "批准你吃";
  $("certMeal").className = "cert-meal";
  $("certMeal").textContent = cur.names;
  $("certMeta").textContent = (inj && D.mealNote ? D.mealNote + " · " : "")
    + (cur.kcal != null ? "约 " + cur.kcal + " kcal · " : "")
    + (cur.realMenu ? "券后 ¥" : "门店价 ¥") + Number(cur.price).toFixed(1);
}
$("swapBtn").onclick = () => {
  buzz(10);
  ci = (ci + 1) % cands.length;
  showMeal(false);
  tone(660, { type: "triangle", dur: .25, vol: .15 });
};
$("againBtn").onclick = () => { buzz(8); toAsk(); };

/* 庆祝：底部烟花升空 + 顶部彩纸飘落，零图片零依赖 */
function launchFireworks(colors) {
  const layer = $("fwLayer");
  const spawn = () => {
    const burst = document.createElement("div");
    burst.className = "fw-burst";
    burst.style.left = (14 + Math.random() * 68) + "%";
    burst.style.setProperty("--peak", (28 + Math.random() * 34) + "vh");
    const n = 12 + Math.floor(Math.random() * 6);
    for (let i = 0; i < n; i++) {
      const s = document.createElement("i");
      const ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const dist = 36 + Math.random() * 46;
      s.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
      s.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(1) + "px");
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = (0.52 + Math.random() * 0.08) + "s";
      burst.appendChild(s);
    }
    layer.appendChild(burst);
    setTimeout(() => burst.remove(), 2000);
  };
  spawn();
  setTimeout(spawn, 180);
  setTimeout(spawn, 380);
}
function confetti(colors) {
  const layer = $("fwLayer");
  for (let i = 0; i < 42; i++) {
    const c = document.createElement("b");
    c.className = "cf";
    c.style.left = (Math.random() * 100).toFixed(1) + "%";
    c.style.background = colors[i % colors.length];
    c.style.setProperty("--x", (Math.random() * 80 - 40).toFixed(0) + "px");
    c.style.setProperty("--rot", (Math.random() * 720 - 360).toFixed(0) + "deg");
    c.style.animationDelay = (Math.random() * .35).toFixed(2) + "s";
    c.style.animationDuration = (1.6 + Math.random() * 1.2).toFixed(2) + "s";
    layer.appendChild(c);
    setTimeout(() => c.remove(), 3400);
  }
}

/* ---------- Stage 3：领券下单 ---------- */
$("goDeal").onclick = () => {
  buzz(12);
  $("dealMeal").textContent = cur.names + (cur.kcal != null ? " · 约 " + cur.kcal + " kcal" : "");
  fillFood($("dealFood"), $("certFood").innerHTML); /* 复用批准书上已出图/已换插画的结果，不重新请求 */
  const row = $("couponRow");
  row.innerHTML = "";
  if (cur.realMenu && cur.coupons > 0) {
    /* 券名用 Skill 注入的真实名字；没给就统称麦麦省券，不编造券种 */
    const names = (D && D.couponNames) || [];
    for (let i = 0; i < Math.min(cur.coupons, 3); i++) {
      const c = document.createElement("div");
      c.className = "coupon";
      c.textContent = (names[i] || "麦麦省券") + " · 已领";
      row.appendChild(c);
    }
  } else {
    const c = document.createElement("div");
    c.className = "coupon";
    c.textContent = "接入 MCP 后自动领取麦麦省券";
    row.appendChild(c);
  }
  $("dealNow").textContent = "¥" + Number(cur.price).toFixed(1);
  $("dealWas").textContent = cur.saved ? "¥" + Number(cur.price + cur.saved).toFixed(1) : "";
  $("dealSave").textContent = cur.saved ? "已省 ¥" + Number(cur.saved).toFixed(1) : "";
  goTo("deal");
};
$("dealUnderlay").onclick = () => goTo("approve");
$("replayBtn").onclick = () => { buzz(8); toAsk(); };
$("orderBtn").onclick = () => {
  buzz([15, 50, 15]);
  alert("在 WorkBuddy 里对我说「就吃这个」，我调麦当劳 MCP 帮你领券下单。");
};

/* ---------- 启动：Skill 注入了 eventId 就直接盖章 ---------- */
preload(FOOD_DB.concat((D && D.meals) || []));
buildAsk();
if (D && D.eventId) {
  const ev = EVENTS.find(e => e.id === D.eventId) || EVENT_MISC;
  approve(ev, D.reason || ev.label, D.taste || "any");
}
</script>
</body>
</html>
