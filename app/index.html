<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>麦反应 McReaction · 你的耳朵和嘴巴发生了反应</title>
<style>
  :root {
    --red: #DA291C;
    --red-dark: #B01E12;
    --yellow: #FFC72C;
    --cream: #F5F5F7;
    --ink: #1D1D1F;
    --ink-soft: #6E6259;
    --line: #E8E0D2;
    --green: #1D9E75;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sheet: cubic-bezier(.32, .72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    background: #000; color: var(--ink);
    max-width: 430px; margin: 0 auto;
    overflow: hidden; position: relative;
  }
  .stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transition: opacity .35s ease;
  }
  .stage.on { opacity: 1; pointer-events: auto; }
  .back {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 50;
    width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(120,120,128,.16); backdrop-filter: blur(8px);
    color: var(--ink); font-size: 18px; display: none; align-items: center; justify-content: center;
  }
  .dots { position: absolute; top: max(24px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 7px; z-index: 50; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(120,120,128,.3); transition: all .3s; }
  .dots i.on { background: var(--red); width: 20px; border-radius: 4px; }

  /* ===== Stage 1 相机 ===== */
  #st-camera { background: #000; color: #fff; align-items: center; justify-content: center; padding: 24px; }
  #st-camera .kicker { font-size: 13px; letter-spacing: 4px; color: rgba(255,255,255,.55); font-weight: 600; }
  #st-camera h1 { font-size: 34px; font-weight: 800; margin-top: 10px; letter-spacing: 1px; }
  #st-camera .sub { font-size: 14px; color: rgba(255,255,255,.6); margin-top: 8px; line-height: 1.7; text-align: center; }
  .lens {
    width: 230px; height: 230px; border-radius: 50%; margin: 36px 0 28px;
    border: 3px solid rgba(255,255,255,.25); position: relative; overflow: hidden;
    background: #111; flex-shrink: 0;
  }
  .lens img { width: 100%; height: 100%; object-fit: cover; display: none; }
  .lens .scan {
    position: absolute; inset: -3px; border-radius: 50%; display: none;
    border: 3px solid var(--yellow); border-top-color: transparent; border-bottom-color: transparent;
    animation: spin 1s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .lens .face-line { position: absolute; inset: 18%; border: 2px dashed rgba(255,199,44,0); border-radius: 50%; transition: border-color .3s; }
  .cam-status { font-size: 13px; color: var(--yellow); min-height: 20px; font-weight: 600; }
  .cam-btns { display: flex; gap: 14px; margin-top: 20px; }
  .cam-btn {
    padding: 15px 26px; border-radius: 999px; border: none; cursor: pointer;
    font-size: 16px; font-weight: 700;
  }
  .cam-btn.primary { background: #fff; color: #000; }
  .cam-btn.ghost { background: rgba(255,255,255,.14); color: #fff; }
  .skip { margin-top: 24px; color: rgba(255,255,255,.45); font-size: 13px; border: none; background: none; cursor: pointer; }

  /* ===== 情绪抽屉 ===== */
  #st-keywords { justify-content: flex-end; }
  #st-keywords .underlay { position: absolute; inset: 0; background: rgba(0,0,0,.4); opacity: 0; transition: opacity .3s; }
  #st-keywords.on .underlay { opacity: 1; }
  .sheet {
    position: relative; background: var(--cream); border-radius: 26px 26px 0 0;
    padding: 12px 24px max(30px, env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .5s var(--sheet);
    max-height: 86%; overflow-y: auto;
  }
  #st-keywords.on .sheet { transform: translateY(0); }
  .grabber { width: 38px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.15); margin: 4px auto 18px; }
  .sheet h2 { font-size: 24px; font-weight: 800; }
  .sheet .sub2 { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .kw-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .kw {
    border: none; border-radius: 18px; padding: 20px 10px; font-size: 17px; font-weight: 700;
    background: #fff; color: var(--ink); cursor: pointer; position: relative;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
    transition: transform .15s ease, background .2s, color .2s;
  }
  .kw:active { transform: scale(.96); }
  .kw.pick { background: var(--red); color: #fff; }
  .kw .mini { display: block; font-size: 11px; font-weight: 500; opacity: .6; margin-top: 4px; }
  .kw .guess { position: absolute; top: -9px; right: 12px; background: var(--yellow); color: var(--ink); font-size: 10px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
  .reshuffle { margin-top: 16px; text-align: center; }
  .reshuffle button { border: none; background: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; text-decoration: underline; }
  .song-mini { margin-top: 14px; }
  .song-mini input {
    width: 100%; border: none; background: #fff; border-radius: 14px; padding: 13px 16px;
    font-size: 15px; outline: none; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }

  /* ===== 主题曲页 ===== */
  #st-track { background: var(--cream); align-items: center; padding: 66px 24px 24px; }
  #st-track .kicker { font-size: 12px; letter-spacing: 3px; color: var(--ink-soft); font-weight: 700; }
  .vinyl-wrap { margin: 30px 0 8px; transform: scale(.2); opacity: 0; }
  #st-track.on .vinyl-wrap { animation: springIn .7s var(--spring) .15s forwards; }
  @keyframes springIn { to { transform: scale(1); opacity: 1; } }
  .vinyl {
    width: 240px; height: 240px; border-radius: 50%; background: #141414; position: relative;
    box-shadow: 0 18px 40px rgba(0,0,0,.22); cursor: pointer;
    display: flex; align-items: center; justify-content: center;
  }
  .vinyl .groove { position: absolute; border-radius: 50%; border: 1.5px solid #2c2c2c; }
  .vinyl .g1 { inset: 12%; } .vinyl .g2 { inset: 20%; } .vinyl .g3 { inset: 28%; }
  .vinyl .label {
    width: 34%; height: 34%; border-radius: 50%; background: var(--yellow);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 800; color: var(--ink); position: relative; z-index: 2; text-align: center;
  }
  .vinyl .label .initial { font-size: 34px; line-height: 1; }
  .vinyl .label .rpm { font-size: 9px; font-weight: 600; opacity: .6; margin-top: 3px; }
  .vinyl .hole { width: 10px; height: 10px; border-radius: 50%; background: var(--cream); position: absolute; z-index: 3; }
  .spinning { animation: spin 2.6s linear infinite; }
  .track-name { font-size: 24px; font-weight: 800; margin-top: 16px; text-align: center; line-height: 1.4; }
  .track-tags { display: flex; gap: 8px; margin-top: 10px; justify-content: center; flex-wrap: wrap; }
  .track-tags span { font-size: 11px; font-weight: 700; background: #fff; color: var(--ink-soft); padding: 5px 11px; border-radius: 999px; }
  .track-tags span.hot { background: var(--red); color: #fff; }
  .lang-pills { display: flex; gap: 8px; margin-top: 12px; justify-content: center; }
  .lang-pills button {
    border: none; border-radius: 999px; padding: 7px 16px; font-size: 12px; font-weight: 700;
    background: #E8E2D6; color: var(--ink-soft); cursor: pointer; transition: all .2s;
  }
  .lang-pills button.on { background: var(--ink); color: #fff; }
  .rarity {
    display: inline-block; font-size: 10px; font-weight: 800; border-radius: 999px;
    padding: 4px 10px; margin-left: 8px; vertical-align: 3px;
  }
  .rarity.ssr { background: #FFC72C; color: #4A2C00; }
  .rarity.sr  { background: #DA291C; color: #fff; }
  .rarity.r   { background: #185FA5; color: #fff; }
  .rarity.n   { background: #1D9E75; color: #fff; }
  .verdict {
    margin-top: 14px; font-size: 14px; font-weight: 600; color: var(--ink);
    background: #fff; border-radius: 14px; padding: 12px 18px; max-width: 320px; text-align: center;
    box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .play-hint { margin-top: 14px; font-size: 13px; color: var(--ink-soft); font-weight: 600; }
  .eq { display: flex; gap: 4px; align-items: flex-end; height: 30px; margin-top: 12px; }
  .eq i { width: 5px; background: var(--red); border-radius: 3px; height: 18%; }

  /* ===== 主食贴纸 ===== */
  #sticker {
    position: absolute; right: 14px; bottom: 120px; z-index: 40; width: 220px;
    transform: scale(0) rotate(-30deg); display: none; cursor: pointer;
  }
  #sticker.pop { display: block; animation: stickerPop .65s var(--spring) forwards; }
  @keyframes stickerPop { to { transform: scale(1) rotate(-7deg); } }
  #sticker .sticker-body {
    background: #fff; border-radius: 22px; padding: 14px 14px 12px;
    border: 3px solid #fff; box-shadow: 0 14px 34px rgba(0,0,0,.25); text-align: center;
  }
  #stickerArt { display: flex; align-items: flex-end; justify-content: center; }
  .photo-a { transform: rotate(-3deg); z-index: 2; }
  .photo-b { margin-left: -24px; transform: rotate(4deg); z-index: 3; }
  .photo-frame {
    background: #fff; border-radius: 12px; padding: 6px 6px 2px;
    box-shadow: 0 3px 10px rgba(0,0,0,.16); width: 106px; border: 1px solid var(--line);
  }
  .photo-b .photo-frame { width: 84px; }
  .photo-frame img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 8px; display: block; background: var(--cream); }
  .photo-frame svg { width: 100%; height: auto; display: block; }
  .photo-name { font-size: 10px; font-weight: 700; margin-top: 5px; text-align: center; }
  #sticker .sticker-name { font-size: 13px; font-weight: 800; margin-top: 8px; }
  #sticker .sticker-cta { font-size: 10px; color: var(--red); font-weight: 700; margin-top: 3px; animation: pulse 1.2s ease infinite; }
  @keyframes pulse { 50% { opacity: .35; } }

  /* ===== 领券抽屉 ===== */
  #st-deal { justify-content: flex-end; z-index: 60; }
  #st-deal .underlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .3s; }
  #st-deal.on .underlay { opacity: 1; }
  #st-deal .sheet { transform: translateY(105%); }
  #st-deal.on .sheet { transform: translateY(0); }
  .coupon-row { display: flex; gap: 10px; margin-top: 18px; overflow-x: auto; padding-bottom: 4px; }
  .coupon {
    flex-shrink: 0; background: #FFF4D6; border: 1.5px dashed #E8B93B; border-radius: 12px;
    padding: 10px 14px; font-size: 12px; font-weight: 700; color: #7A5B0B;
  }
  .price-line { display: flex; align-items: baseline; gap: 10px; margin-top: 18px; }
  .price-line .now { font-size: 34px; font-weight: 800; color: var(--red); }
  .price-line .was { font-size: 14px; color: var(--ink-soft); text-decoration: line-through; }
  .price-line .save { font-size: 12px; font-weight: 800; color: var(--green); }
  .order-btn {
    display: block; width: 100%; margin-top: 18px; padding: 17px; border: none; cursor: pointer;
    background: var(--yellow); color: var(--ink); font-size: 17px; font-weight: 800;
    border-radius: 16px; letter-spacing: 1px;
  }
  .order-btn:active { transform: scale(.97); }
  .share-line { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 14px; }
  .replay { text-align: center; margin-top: 10px; }
  .replay button { border: none; background: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; text-decoration: underline; }

  .src-tag { position: absolute; bottom: max(12px, env(safe-area-inset-bottom)); left: 0; right: 0; text-align: center; font-size: 10px; color: #B4A795; z-index: 10; padding: 0 20px; }
</style>
</head>
<body>

<div class="dots" id="dots"><i class="on"></i><i></i><i></i><i></i></div>
<button class="back" id="backBtn" aria-label="返回">‹</button>

<!-- Stage 1：自拍 -->
<section class="stage on" id="st-camera">

<section class="stage" id="st-keywords">

<!-- Stage 3：主题曲 -->
<section class="stage" id="st-track">

      <div class="groove g1"></div><div class="groove g2"></div><div class="groove g3"></div>

  <div class="verdict" id="verdict" style="display:none"></div>
  <div class="play-hint" id="playHint">点唱片，播放你的主题曲</div>
  <div class="eq" id="eq"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
  <div class="src-tag" id="srcTag">演示数据 · 接入麦当劳 MCP 后为实时菜单与券价</div>
</section>

<!-- 主食贴纸 -->
<div id="sticker">
  <div class="sticker-body">
    <div id="stickerArt"></div>
    <div class="sticker-name" id="stickerName">—</div>
    <div class="sticker-cta">点我领券去下单</div>
  </div>
</div>

<!-- Stage 4：领券下单 -->
<section class="stage" id="st-deal">
  <div class="underlay" id="dealUnderlay"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <h2>今日最搭已配好</h2>
    <div class="sub2" id="dealMeal">—</div>
    <div class="coupon-row" id="couponRow"></div>
    <div class="price-line">
      <span class="now" id="dealNow">¥0</span>

<script>

/* ---------- 数据 ---------- */

/* 情绪 → 关键词匹配：主食+饮品 或 小吃组合。关键词在 FOOD_DB 里按序匹配。 */
const MOOD_FOOD = {
  energetic: { type: "main+drink",  main: ["双层吉士"],       drink: ["鲜萃咖啡", "咖啡"] },
  tired:     { type: "main+drink",  main: ["麦辣鸡腿"],       drink: ["鲜萃咖啡", "咖啡"] },

/* 本地粗读：亮度猜情绪 */
function readBrightness(img, cb) {
  try {
    const c = document.createElement("canvas");
    c.width = c.height = 32;
    const x = c.getContext("2d");
    x.drawImage(img, 0, 0, 32, 32);
    const d = x.getImageData(0, 0, 32, 32).data;
    let l = 0;
    for (let i = 0; i < d.length; i += 4) l += (d[i] + d[i+1] + d[i+2]) / 3;
    cb(l / (d.length / 4) / 255);
  } catch (e) { cb(0.5); }
}

  if (b > 0.62) return "energetic";

}

/* ---------- Web Audio 引擎 ---------- */
function initAudioGesture() {
  if (!audio) audio = buildAudio();
  if (audio.ctx.state === "suspended") audio.ctx.resume();
}
function buildAudio() {
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const master = ctx.createGain(); master.gain.value = .5;
  const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 1400;
  master.connect(lp); lp.connect(ctx.destination);
  const nb = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate);
  const nd = nb.getChannelData(0);
  for (let i = 0; i < nd.length; i++) nd[i] = (Math.random() * 2 - 1) * .25;
  const vinyl = ctx.createBufferSource(); vinyl.buffer = nb; vinyl.loop = true;
  const vg = ctx.createGain(); vg.gain.value = .012;
  const vhp = ctx.createBiquadFilter(); vhp.type = "highpass"; vhp.frequency.value = 2500;
  vinyl.connect(vhp); vhp.connect(vg); vg.connect(master); vinyl.start();
  return { ctx, master, lp };
}
function scheduleNote(a, time, m, step, bar) {
  const chords = CHORD_LIB[m.id];
  const chord = chords[bar % chords.length];
  const stepDur = 60 / m.bpm / 4;
  const t = time + (step % 2 === 1 ? m.swing * stepDur : 0);
  if (step === 0 || (m.id === "hype" && step === 10)) {
    const o = a.ctx.createOscillator(), g = a.ctx.createGain();
    o.type = "sine";
    o.frequency.setValueAtTime(150, t);
    o.frequency.exponentialRampToValueAtTime(45, t + .12);
    g.gain.setValueAtTime(.9, t);
    g.gain.exponentialRampToValueAtTime(.001, t + .18);
    o.connect(g); g.connect(a.master); o.start(t); o.stop(t + .2);
  }
  if (Math.random() < m.hat && step % 2 === 1) {
    const s = a.ctx.createBufferSource();
    const hb = a.ctx.createBuffer(1, a.ctx.sampleRate * .06, a.ctx.sampleRate);
    const hd = hb.getChannelData(0);
    for (let i = 0; i < hd.length; i++) hd[i] = (Math.random() * 2 - 1) * (1 - i / hd.length);
    s.buffer = hb;
    const hp = a.ctx.createBiquadFilter(); hp.type = "highpass"; hp.frequency.value = 8000;
    const g = a.ctx.createGain(); g.gain.value = .18;
    s.connect(hp); hp.connect(g); g.connect(a.master); s.start(t);
  }
  if (step % 4 === 0 || step % 8 === 6) {
    const o = a.ctx.createOscillator(), g = a.ctx.createGain();
    o.type = "triangle";
    o.frequency.value = midi2freq(m.root + chord[0] - 12 + (step % 8 === 6 ? 12 : 0));
    g.gain.setValueAtTime(.0001, t);
    g.gain.linearRampToValueAtTime(.4, t + .02);
    g.gain.exponentialRampToValueAtTime(.001, t + stepDur * 3);
    o.connect(g); g.connect(a.master); o.start(t); o.stop(t + stepDur * 4);
  }
  if (step === 0 || step === 8) {
    chord.forEach(semi => {
      [-6, 6].forEach(det => {
        const o = a.ctx.createOscillator(), g = a.ctx.createGain();
        o.type = "sawtooth";
        o.frequency.value = midi2freq(m.root + 12 + semi);
        o.detune.value = det;
        g.gain.setValueAtTime(.0001, t);
        g.gain.linearRampToValueAtTime(.05, t + .05);
        g.gain.exponentialRampToValueAtTime(.001, t + stepDur * 7);
        o.connect(g); g.connect(a.master); o.start(t); o.stop(t + stepDur * 8);
      });
    });
  }
}
let nextTime = 0, curStep = 0, curBar = 0;
function startAudio() {
  if (!mood) return;
  initAudioGesture();
  audio.lp.frequency.value = mood.bright;
  playing = true;
  curStep = 0; curBar = 0;
  nextTime = audio.ctx.currentTime + .06;
  schedTimer = setInterval(() => {
    while (nextTime < audio.ctx.currentTime + .12) {
      scheduleNote(audio, nextTime, mood, curStep, curBar);
      nextTime += 60 / mood.bpm / 4;
      curStep = (curStep + 1) % 16;
      if (curStep === 0) curBar++;
    }
  }, 25);
  $("vinyl").classList.add("spinning");
  $("playHint").textContent = "正在播放 · 你的耳朵和嘴巴正在反应";
  eqTimer = setInterval(() => {
    document.querySelectorAll("#eq i").forEach(b => b.style.height = (playing ? 15 + Math.random() * 85 : 18) + "%");
  }, 120);
  setTimeout(showSticker, 1800);
}
function stopAudio() {
  if (schedTimer) clearInterval(schedTimer);
  if (eqTimer) clearInterval(eqTimer);
  schedTimer = eqTimer = null;
  playing = false;
  const v = $("vinyl");
  if (v) v.classList.remove("spinning");
  document.querySelectorAll("#eq i").forEach(b => b.style.height = "18%");
}
