<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#DA291C">
<title>麦麦批准 · 今天这顿，麦当劳批了</title>
<style>
  :root {
    --red: #DA291C;
    --red-dark: #A8170D;
    --red-hi: #F2483A;
    --yellow: #FFC72C;
    --gold: #C9A227;
    --paper: #FFF9EE;
    --ink: #1D1D1F;
    --ink-soft: #6E6259;
    --line: #E8DCC6;
    --green: #1D9E75;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sheet: cubic-bezier(.32, .72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* html 也要 hidden：否则 body 的 overflow 会转交给视口，藏在屏幕下方的抽屉撑出滚动区，
     输入框聚焦时整页被滚走露出黑边。body 用 clip（不可被程序滚动），hidden 兜底老浏览器 */
  html { height: 100%; overflow: hidden; background: #111; }
  body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: var(--red-dark); color: var(--ink);
    max-width: 430px; margin: 0 auto;
    overflow: hidden; overflow: clip; position: relative;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; cursor: pointer; }
  .red-bg { background: radial-gradient(130% 70% at 50% 0%, var(--red-hi) 0%, var(--red) 42%, var(--red-dark) 100%); }
  .stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transform: translateY(12px) scale(.985);
    transition: opacity .26s ease, transform .26s var(--sheet);
  }
  .stage.on { opacity: 1; pointer-events: auto; transform: none; }
  .back {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 50;
    width: 36px; height: 36px; border-radius: 50%; border: none;
    background: rgba(255,255,255,.18);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: #fff; font-size: 18px; display: none; align-items: center; justify-content: center;
  }
  .dots { position: absolute; top: max(24px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 7px; z-index: 50; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,.35); transition: all .3s; }
  .dots i.on { background: var(--yellow); width: 20px; border-radius: 4px; }

  /* ===== iOS 按压反馈 ===== */
  .back, .submit, .order-btn, .cta-row button, .replay button {
    transition: transform .14s var(--spring), filter .14s ease, opacity .2s ease, background .2s, color .2s;
  }
  .back:active, .cta-row button:active, .replay button:active { transform: scale(.94); }
  .submit:active, .order-btn:active { transform: scale(.97); filter: brightness(.95); }

  /* ===== Stage 1 犒劳申请单 ===== */
  #st-ask { color: #fff; overflow-y: auto; padding-top: max(40px, env(safe-area-inset-top)); }
  .ask-top { padding: 0 26px 16px; }
  .ask-kicker { font-size: 12px; letter-spacing: 3px; color: var(--yellow); font-weight: 800; }
  .ask-date { font-size: 13px; font-weight: 600; opacity: .8; margin-top: 12px; }
  .ask-time { font-size: 50px; font-weight: 800; letter-spacing: -1px; line-height: 1; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .ask-greet { font-size: 19px; font-weight: 700; margin-top: 8px; line-height: 1.45; }
  .form {
    flex: 1; background: var(--paper); color: var(--ink);
    border-radius: 24px 24px 0 0; padding: 16px 20px max(14px, env(safe-area-inset-bottom));
    box-shadow: 0 -12px 30px rgba(0,0,0,.18);
  }
  #st-ask.on .form { animation: formUp .55s var(--sheet) .05s both; }
  @keyframes formUp { from { transform: translateY(70px); opacity: 0; } }
  /* 表头：左边单据信息，右边"贴这里"虚线槽 */
  .form-head { display: flex; justify-content: space-between; align-items: center; padding-bottom: 14px; border-bottom: 1.5px dashed rgba(218,41,28,.35); }
  .fh b { display: block; font-size: 19px; color: var(--red); letter-spacing: 3px; font-weight: 900; }
  .fh span { display: block; font-size: 10px; color: var(--ink-soft); letter-spacing: 1px; margin-top: 3px; font-variant-numeric: tabular-nums; }
  .fh em { display: block; font-style: normal; font-size: 12px; font-weight: 700; margin-top: 10px; }
  .slot {
    position: relative; flex-shrink: 0; width: 120px; height: 88px; border-radius: 16px;
    border: 2px dashed rgba(218,41,28,.4); display: flex; align-items: center; justify-content: center;
    transition: background .25s, border-color .25s;
  }
  .slot-ph { font-size: 11px; font-weight: 800; color: rgba(218,41,28,.65); text-align: center; line-height: 1.5; }
  .slot.filled { border-color: rgba(218,41,28,.15); background: rgba(255,199,44,.22); }
  /* 飞行中的贴纸要盖过下方贴纸本 */
  .slot-stk { position: relative; z-index: 5; display: inline-flex; transform: rotate(-6deg); }
  .slot-stk .stk-emo { font-size: 38px; }
  .slot-stk.landed { animation: land .38s var(--spring); }
  @keyframes land { 0% { transform: scale(1.3) rotate(-6deg); } 45% { transform: scale(.9, 1.1) rotate(-6deg); } 100% { transform: rotate(-6deg); } }
  .slot-stars { position: absolute; bottom: -8px; left: 50%; transform: translateX(-50%); background: var(--paper); padding: 0 5px; font-size: 10px; font-style: normal; font-weight: 700; color: var(--red); letter-spacing: 1px; white-space: nowrap; }
  .form-label { font-size: 12px; font-weight: 800; color: var(--ink-soft); margin: 14px 0 8px; letter-spacing: 1px; }
  .form-label small { font-weight: 600; margin-left: 6px; opacity: .7; letter-spacing: 0; }
  .form-label small.warn { color: var(--red); opacity: 1; }

  /* 白边贴纸：emoji + 标签作为一个整体，四向白色实心投影沿轮廓描出模切白边 */
  .stk-body {
    display: inline-flex; flex-direction: column; align-items: center;
    filter: drop-shadow(3px 0 0 #fff) drop-shadow(-3px 0 0 #fff) drop-shadow(0 3px 0 #fff) drop-shadow(0 -3px 0 #fff) drop-shadow(0 3px 4px rgba(0,0,0,.22));
  }
  .stk-emo { font-size: 34px; line-height: 1.1; }
  .stk-tag { margin-top: -5px; font-size: 11.5px; font-weight: 900; padding: 3px 7px; border-radius: 7px; white-space: nowrap; letter-spacing: .5px; }
  .t-red .stk-tag { background: var(--red); color: #fff; }
  .t-ink .stk-tag { background: var(--ink); color: var(--yellow); }
  /* 贴纸本：黄底波点，白边才看得见 */
  .sheet-panel {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px 0; padding: 12px 4px 10px; border-radius: 18px;
    background: radial-gradient(rgba(218,41,28,.12) 1.2px, transparent 1.7px) 0 0 / 14px 14px, #FFE6A0;
    box-shadow: inset 0 1px 4px rgba(0,0,0,.08);
  }
  .ev-stk {
    background: none; border: none; padding: 4px 0; display: flex; justify-content: center;
    transform: translateY(var(--dy)) rotate(var(--rot)); transition: transform .25s var(--spring), opacity .2s;
  }
  .ev-stk:active { transform: translateY(var(--dy)) rotate(var(--rot)) scale(.88); }
  /* 被撕下贴到申请单上：原位只剩浅浅的印子 */
  .ev-stk.peeled { opacity: .3; transform: translateY(var(--dy)) rotate(var(--rot)) scale(.86); }
  .write-row { display: flex; align-items: center; gap: 8px; margin-top: 10px; font-size: 13px; font-weight: 700; color: var(--ink-soft); }
  .write-row span { flex-shrink: 0; }
  .form-input {
    flex: 1; min-width: 0; border: none; border-bottom: 1.5px solid var(--line);
    background: transparent; padding: 8px 2px; font-size: 16px; font-family: inherit; color: var(--ink);
    outline: none; border-radius: 0;
    user-select: text; -webkit-user-select: text; /* iOS：父级禁选会导致输入框打不了字 */
  }
  .form-input:focus { border-bottom-color: var(--red); }

  /* 想吃点：圆形徽章贴纸，选中歪头弹一下并冒一句话 */
  .taste-row { display: flex; justify-content: space-between; padding-top: 26px; }
  .taste { position: relative; background: none; border: none; display: flex; flex-direction: column; align-items: center; width: 50px; }
  .taste:active .taste-badge { transform: scale(.9); }
  .taste-badge {
    width: 44px; height: 44px; border-radius: 50%; background: #FFE6A0; font-size: 23px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 0 0 3px #fff, 0 4px 8px rgba(0,0,0,.16);
    transition: transform .3s var(--spring), background .2s;
  }
  .taste small { font-size: 11px; font-weight: 800; color: var(--ink-soft); margin-top: 7px; white-space: nowrap; }
  .taste.on .taste-badge { background: var(--red); transform: scale(1.14) rotate(-10deg); }
  .taste.on small { color: var(--red); }
  .bubble {
    position: absolute; bottom: calc(100% + 4px); left: 50%; transform: translateX(-50%) scale(.3); opacity: 0;
    white-space: nowrap; background: var(--ink); color: #fff; font-size: 11px; font-style: normal; font-weight: 800;
    padding: 4px 8px; border-radius: 8px; pointer-events: none; transition: transform .3s var(--spring), opacity .2s;
  }
  .bubble::after { content: ""; position: absolute; top: 100%; left: 50%; margin-left: -4px; border: 4px solid transparent; border-top-color: var(--ink); }
  .taste.on .bubble { opacity: 1; transform: translateX(-50%) scale(1); }

  .submit {
    display: block; width: 100%; margin-top: 18px; padding: 16px; border: none; border-radius: 16px;
    background: var(--red); color: #fff; font-size: 17px; font-weight: 800; letter-spacing: 3px;
    box-shadow: 0 8px 18px rgba(218,41,28,.32);
  }
  /* 小屏：提交按钮吸底，主操作永远看得见；开屏区压缩 */
  .submit { position: sticky; bottom: max(10px, env(safe-area-inset-bottom)); z-index: 6; }
  @media (max-height: 700px) {
    .ask-date { margin-top: 8px; }
    .ask-time { font-size: 40px; }
    .ask-greet { font-size: 17px; margin-top: 6px; }
    .ask-top { padding-bottom: 12px; }
    .form-label { margin: 10px 0 6px; }
    .submit { margin-top: 12px; }
  }
  /* 英文版：单词更长，字号和字距收一点 */
  .lang-en .stk-tag { font-size: 10.5px; letter-spacing: 0; }
  .lang-en .ask-kicker { letter-spacing: 2px; }
  .lang-en .fh b, .lang-en .cert-head .t { letter-spacing: 1px; }
  .lang-en .cert-head .t { font-size: 19px; }
  .lang-en .ask-greet { font-size: 18px; }
  .lang-en .cert-row dt { width: 80px; }
  .lang-en .stamp b { font-size: 15px; letter-spacing: .5px; }
  .lang-en .submit { letter-spacing: 1px; }
  .lang-en .taste small { font-size: 10px; }
  .shake-x { animation: shakeX .36s ease; }
  @keyframes shakeX { 20%, 60% { transform: translateX(-6px); } 40%, 80% { transform: translateX(6px); } }
  .foot-note { text-align: center; font-size: 10px; color: #B4A795; margin-top: 12px; }

  /* ===== Stage 2 批准书 ===== */
  #st-approve { align-items: center; padding: 56px 16px max(16px, env(safe-area-inset-bottom)); overflow-x: hidden; overflow-y: auto; }
  /* 放射光：收在 inset:0 的图层里裁切，避免 900px 大圆撑出滚动区 */
  .burst-layer { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
  .burst {
    --burst: rgba(255,199,44,.3);
    position: absolute; left: 50%; top: 46%; width: 900px; height: 900px; margin: -450px 0 0 -450px; border-radius: 50%;
    background: repeating-conic-gradient(var(--burst) 0deg 9deg, transparent 9deg 18deg);
    -webkit-mask-image: radial-gradient(circle, #000 0%, transparent 62%); mask-image: radial-gradient(circle, #000 0%, transparent 62%);
    opacity: 0; transition: opacity .7s ease; animation: spin 30s linear infinite;
  }
  #st-approve.won .burst { opacity: 1; }
  #st-approve.gold .burst { --burst: rgba(255,226,140,.55); }
  @keyframes spin { to { transform: rotate(360deg); } }
  .cert-wrap { position: relative; z-index: 1; width: 100%; max-width: 380px; flex-shrink: 0; transform: translateY(50px) rotate(-2deg); opacity: 0; }
  #st-approve.on .cert-wrap { animation: certIn .55s var(--sheet) .05s forwards; }
  @keyframes certIn { to { transform: none; opacity: 1; } }
  .cert { position: relative; background: var(--paper); border-radius: 10px; padding: 22px 22px 14px; box-shadow: 0 18px 40px rgba(0,0,0,.28); }
  .cert::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(218,41,28,.3); border-radius: 5px; pointer-events: none; }
  .cert.shake { animation: certShake .3s ease; }
  @keyframes certShake { 30% { transform: translateY(4px) rotate(-.5deg); } 60% { transform: translateY(-1px) rotate(.25deg); } }
  .cert-head { text-align: center; }
  .cert-head .t { font-size: 22px; font-weight: 900; letter-spacing: 4px; color: var(--red); }
  .cert-head .no { font-size: 10px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .cert-gold {
    display: none; margin-top: 8px; padding: 4px 0; font-size: 12px; font-weight: 900; color: #9A7000; letter-spacing: 2px;
    background: linear-gradient(90deg, transparent, #FFE9A8 20%, #FFE9A8 80%, transparent);
  }
  .cert.gold .cert-gold { display: block; }
  .cert dl { margin-top: 6px; }
  .cert-row { display: flex; gap: 10px; font-size: 13px; line-height: 1.5; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .cert-row dt { color: var(--ink-soft); flex-shrink: 0; width: 60px; }
  .cert-row dd { font-weight: 700; flex: 1; word-break: break-all; }
  .cert-row .stars { color: var(--red); letter-spacing: 2px; }
  .cert-verdict { margin-top: 10px; padding: 9px 14px 11px; background: #fff; border-radius: 12px; box-shadow: inset 0 0 0 1px #F0E3CB; text-align: center; }
  .cert-verdict small { display: block; font-size: 10px; color: var(--ink-soft); letter-spacing: 2px; font-weight: 700; }
  .cert-verdict p { font-size: 15px; font-weight: 800; margin-top: 3px; min-height: 23px; }
  .cert-verdict p.pending { color: var(--ink-soft); font-weight: 600; animation: pulse 1s ease infinite; }
  @keyframes pulse { 50% { opacity: .35; } }
  .cert-food { display: flex; align-items: flex-end; justify-content: center; margin-top: 8px; min-height: 160px; }
  .cert-food .photo-a { width: 220px; }
  .cert-food .photo-b { width: 156px; margin-left: -90px; }
  .cert-food .photo-a:only-child { width: 244px; }
  .mystery {
    width: 132px; height: 132px; border-radius: 50%; border: 2px dashed rgba(218,41,28,.45);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    color: rgba(218,41,28,.7); animation: breathe 1.1s ease-in-out infinite;
  }
  .mystery b { font-size: 46px; line-height: 1; font-weight: 900; }
  .mystery small { font-size: 11px; margin-top: 4px; font-weight: 800; letter-spacing: 2px; }
  @keyframes breathe { 50% { transform: scale(1.06); } }
  /* 揭晓：食物从"?"里蹦出来 + 金光 */
  .cert-food.reveal > div { animation: foodPop .65s var(--spring) both; }
  .cert-food.reveal .photo-b { animation-delay: .12s; }
  @keyframes foodPop { from { opacity: 0; transform: translateY(30px) scale(.2) rotate(-25deg); } to { opacity: 1; transform: translateY(var(--y, 0)) rotate(var(--r)); } }
  /* 揭晓金光：同样是 5 层 filter，和常态逐层插值过渡 */
  .cert-food.reveal .stk img, .cert-food.reveal .stk svg { animation: glow 1.4s ease-out; }
  @keyframes glow { 0%, 30% { filter: var(--stk) drop-shadow(0 0 24px rgba(255,199,44,1)); } }
  .cert-meal-label { text-align: center; font-size: 11px; color: var(--red); font-weight: 800; letter-spacing: 2px; margin-top: 8px; }
  .cert-meal { text-align: center; font-size: 17px; font-weight: 900; margin-top: 2px; }
  .cert-meal.muted { font-size: 14px; font-weight: 600; color: var(--ink-soft); }
  .cert-meta { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 2px; }
  .cert-meta:empty, .cert-rx:empty { display: none; }
  /* 麦麦处方：一句话讲清"为什么是它" */
  .cert-rx { margin: 6px auto 0; max-width: 300px; text-align: center; font-size: 12.5px; font-weight: 700; color: var(--ink); line-height: 1.45; background: rgba(255,199,44,.22); border-radius: 10px; padding: 5px 10px; }
  .cert-rx b { color: var(--red); margin-right: 4px; font-weight: 900; }
  /* 事由行直接贴申请单上那张贴纸（联动） */
  .cert-row dd .stk-body { flex-direction: row; transform: rotate(-3deg); transform-origin: left center; }
  .cert-row dd .stk-emo { font-size: 20px; }
  .cert-row dd .stk-tag { margin: 0 0 0 -3px; font-size: 12px; white-space: normal; text-align: left; max-width: 180px; }
  .cert-row.reason-row { align-items: center; }
  /* 价格：门店价划线，优惠价放大标红 */
  .cert-price { display: flex; justify-content: center; align-items: baseline; gap: 8px; margin-top: 4px; min-height: 26px; }
  .cert-price s { font-size: 12px; color: var(--ink-soft); }
  .cert-price b { font-size: 22px; font-weight: 900; color: var(--red); }
  .cert-price b small { font-size: 12px; margin-right: 2px; }
  .cert-price em { font-style: normal; font-size: 11px; font-weight: 800; color: #fff; background: var(--green); padding: 2px 7px; border-radius: 999px; }
  .cert-price .plain { font-size: 15px; font-weight: 800; color: var(--ink); white-space: nowrap; }
  .cert-price .hint { font-size: 11px; font-weight: 700; color: var(--red); background: rgba(218,41,28,.08); padding: 3px 8px; border-radius: 999px; white-space: nowrap; }
  .cert-sign { font-size: 11px; color: var(--ink-soft); margin-top: 12px; padding-top: 9px; border-top: 1px dashed var(--line); }
  .cert-src { text-align: center; font-size: 9px; color: #B4A795; margin-top: 8px; letter-spacing: .5px; }
  .stamp {
    position: absolute; right: 10px; top: 50px; width: 128px; height: 128px; border-radius: 50%;
    border: 4px solid var(--red); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 7px var(--red);
    color: var(--red); display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transform: rotate(-16deg) scale(3); mix-blend-mode: multiply; pointer-events: none;
  }
  .stamp b { font-size: 30px; font-weight: 900; letter-spacing: 3px; line-height: 1.05; text-align: center; }
  .stamp small { font-size: 9px; font-weight: 800; margin-top: 4px; }
  .stamp.hit { animation: stampHit .3s cubic-bezier(.5, 0, .75, 0) forwards; }
  @keyframes stampHit {
    0%   { opacity: 0; transform: rotate(-16deg) scale(3); }
    60%  { opacity: .95; }
    100% { opacity: .9; transform: rotate(-16deg) scale(1); }
  }
  .stamp::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 3px solid currentColor; opacity: 0; }
  .stamp.hit::after { animation: inkRing .5s ease-out .3s; }
  @keyframes inkRing { from { opacity: .6; transform: scale(1); } to { opacity: 0; transform: scale(1.7); } }
  .cert.gold .stamp { color: #B8860B; border-color: var(--gold); box-shadow: inset 0 0 0 4px var(--paper), inset 0 0 0 7px var(--gold); }
  .approve-cta {
    position: relative; z-index: 1; width: 100%; max-width: 380px; flex-shrink: 0;
    opacity: 0; transform: translateY(10px); pointer-events: none; transition: opacity .3s, transform .3s var(--sheet);
  }
  .approve-cta.on { opacity: 1; transform: none; pointer-events: auto; }
  .approve-cta .order-btn { margin-top: 16px; }
  .cta-row { display: flex; justify-content: center; align-items: center; gap: 4px; margin-top: 10px; color: rgba(255,255,255,.5); font-size: 13px; }
  .cta-row button { border: none; background: none; color: #fff; font-size: 14px; font-weight: 700; padding: 6px 8px; }

  /* ===== 存图浮层：canvas 画好的批准书，长按/下载带走 ===== */
  .save-layer { position: absolute; inset: 0; z-index: 90; background: rgba(20,8,6,.86); display: none; align-items: center; justify-content: center; padding: 24px; }
  .save-layer.on { display: flex; }
  .save-card { display: flex; flex-direction: column; align-items: center; gap: 10px; max-height: 100%; }
  .save-card img { max-width: 100%; max-height: 62vh; width: auto; border-radius: 12px; box-shadow: 0 18px 40px rgba(0,0,0,.45); }
  .save-hint { color: #fff; font-size: 13px; font-weight: 700; opacity: .88; text-align: center; }
  .save-ops { display: flex; align-items: center; gap: 14px; }
  .save-ops .order-btn { width: auto; margin: 0; padding: 10px 22px; font-size: 15px; text-decoration: none; display: inline-block; }
  .save-ops button { border: none; background: none; color: rgba(255,255,255,.75); font-size: 13px; padding: 8px; text-decoration: underline; }

  /* ===== 沿食物轮廓的白边贴纸（批准书 + 领券抽屉共用）=====

<script>
/* @pure-begin 纯数据与纯函数（verify.py 会单独抽出来跑断言） */
/* 真实菜单快照：麦当劳 MCP query-meals（东莞门店 1421187，2026-10-09；图片地址 2026-10-10 复核，官方会改后缀/文件名，失效就重拉）。

   needs：这样东西能给情绪什么（发泄/安慰/庆祝/犒赏/补能/取暖/恢复/小确幸/安全感），排越前越对症。 */
const FOOD_DB = [
  { k: "bigmac",       name: "巨无霸",       price: 26.5, kcal: 513, needs: ["reward", "celebrate", "refuel"], img: "https://menu-img.mcd.cn/pcm/prod/menu/20260309/product/MS_1100_320.png" },

  { k: "grilled",      name: "板烧鸡腿堡",   price: 23.5, kcal: 391, needs: ["recover", "refuel"], img: "https://menu-img.mcd.cn/pcm/prod/menu/20241008/product/MS_1406_320.png" },
  { k: "mcSpicy",      name: "麦辣鸡腿汉堡", price: 22.5, kcal: 485, needs: ["refuel", "vent", "reward"], img: "https://menu-img.mcd.cn/pcm/prod/menu/20260325/product/MS_1440_320.png" },
  { k: "mcChicken",    name: "麦香鸡",       price: 16.5, kcal: 369, needs: ["warm", "comfort", "treat"], img: "https://menu-img.mcd.cn/pcm/prod/menu/ProductPool/product/MS_1450_320.png" },
  { k: "filet",        name: "麦香鱼",       price: 22,   kcal: 325, needs: ["comfort", "safe"], img: "https://menu-img.mcd.cn/pcm/prod/menu/20260101/product/MS_1600_320.png" },
  { k: "fries",        name: "薯条",         price: 14,   kcal: 289, needs: ["safe", "comfort", "celebrate", "treat"], img: "https://menu-img.mcd.cn/pcm/prod/menu/20250523/product/MS_G4810_320_1747877491921.png" },
  { k: "nuggets",      name: "麦乐鸡",       price: 14.5, kcal: 213, needs: ["celebrate", "comfort", "treat"], img: "https://menu-img.mcd.cn/pcm/prod/menu/20260529/product/MS_G1401_320.png" },
  { k: "wings",        name: "麦辣鸡翅",     price: 14.5, kcal: 224, needs: ["vent", "celebrate", "treat"], img: "https://menu-img.mcd.cn/pcm/prod/menu/20260325/product/MS_G1700_320.png" },
  { k: "corn",         name: "玉米杯",       price: 13,   kcal: 87, needs: ["warm", "recover"],  img: "https://menu-img.mcd.cn/pcm/prod/menu/ProductPool/product/MS_G4437_320.png" },
  { k: "flurry",       name: "经典麦旋风",   price: 15,   kcal: 266, needs: ["comfort", "treat"], img: "https://menu-img.mcd.cn/pcm/prod/menu/ProductPool/product/MS_9900008754_320.gif" },
  { k: "sundae",       name: "新地",         price: 12.5, kcal: 282, needs: ["comfort", "treat"], img: "https://menu-img.mcd.cn/pcm/prod/menu/ProductPool/product/MS_9900008745_320.gif" },
  { k: "cone",         name: "圆筒冰淇淋",   price: 5,    kcal: 93, needs: ["treat"],  img: "https://menu-img.mcd.cn/pcm/prod/menu/ProductPool/product/MS_515837_320.png" },
  { k: "coke",         name: "可乐",         price: 9.5,  kcal: 147, needs: ["refuel", "celebrate", "vent"], img: "https://menu-img.mcd.cn/pcm/prod/menu/ProductPool/product/MS_9900008751_320.gif" },
  { k: "coffee",       name: "鲜萃咖啡",     price: 10,   kcal: 15, needs: ["refuel", "warm"],  img: "https://menu-img.mcd.cn/pcm/prod/menu/20250324/product/MS_G520688_320.png" },
  { k: "appleJuice",   name: "100% 苹果汁",  price: 11.5, kcal: 88, needs: ["recover"],  img: "https://menu-img.mcd.cn/pcm/prod/menu/20250430/product/MS_6362_320_1745552987716.png" }
];

/* 事件表：今天发生的事 → 情绪需求（need，决定吃什么）+ 犒劳指数（level，决定吃多少）；meal 是口味选"都行"时的首选。
   文字（贴纸标签/批准书事由/判词）在 I18N 里；判词只说人不说菜，换口味/换一个都不穿帮。 */
const EVENTS = [
  { id: "ot",      emo: "🌙", need: "refuel",    level: 4, meal: ["mcSpicy", "fries"] },
  { id: "scolded", emo: "💢", need: "vent",      level: 4, meal: ["mcSpicy", "wings"] },
  { id: "done",    emo: "🎉", need: "celebrate", level: 3, meal: ["wings", "coke"] },
  { id: "payday",  emo: "💰", need: "reward",    level: 4, meal: ["bigmac", "fries"] },
  { id: "rain",    emo: "☔", need: "warm",      level: 2, meal: ["mcChicken", "coffee"] },
  { id: "emo",     emo: "🥲", need: "comfort",   level: 3, meal: ["fries", "flurry"] },
  { id: "workout", emo: "💪", need: "recover",   level: 3, meal: ["grilled", "appleJuice"] },
  { id: "nothing", emo: "🦥", need: "treat",     level: 1, meal: ["cone"] }
];
/* 一句话没命中任何事件：照抄原话上批准书，给一份标准餐 */
const EVENT_MISC = { id: "misc", emo: "✏️", need: "safe", level: 3, meal: ["filet", "fries"] };

/* 口味 × 犒劳指数 → 候选餐。犒劳指数定份量，口味定吃什么；第一个是首选，"换一个"按序轮换。
   每个口味都满足：1 星最大份 < 4 星最小份（verify.py 断言）。 */
const TASTES = [
  { id: "any", emo: "🎲" }, { id: "burger", emo: "🍔" }, { id: "chicken", emo: "🍗" },
  { id: "spicy", emo: "🌶️" }, { id: "sweet", emo: "🍦" }, { id: "light", emo: "🥗" }
];
const COMBOS = {
  burger:  { 1: [["mcChicken"], ["fries"]], 2: [["mcChicken", "coffee"], ["filet", "coffee"]], 3: [["doubleCheese", "coke"], ["bigmac", "coffee"], ["mcChicken", "fries"], ["grilled", "corn"]], 4: [["bigmac", "fries"], ["doubleCheese", "fries"], ["bigmac", "coke"]] },
  chicken: { 1: [["nuggets"], ["wings"]], 2: [["nuggets", "coke"], ["wings", "coke"], ["nuggets", "corn"]], 3: [["mcSpicy", "coke"], ["wings", "fries"], ["nuggets", "fries"], ["grilled", "corn"]], 4: [["mcSpicy", "fries"], ["mcSpicy", "wings"]] },
  spicy:   { 1: [["wings"]], 2: [["wings", "coke"], ["mcSpicy"], ["wings", "coffee"]], 3: [["mcSpicy", "coke"], ["wings", "fries"], ["mcSpicy", "appleJuice"]], 4: [["mcSpicy", "fries"], ["mcSpicy", "wings"]] },
  sweet:   { 1: [["cone"], ["sundae"]], 2: [["flurry", "coffee"], ["sundae", "coffee"]], 3: [["nuggets", "flurry"], ["mcChicken", "sundae"], ["fries", "flurry"], ["grilled", "sundae"]], 4: [["doubleCheese", "sundae"], ["mcSpicy", "flurry"]] },
  light:   { 1: [["corn"], ["cone"]], 2: [["filet", "coffee"], ["grilled", "coffee"]], 3: [["grilled", "appleJuice"], ["filet", "corn"]], 4: [["grilled", "nuggets"], ["filet", "fries"]] }
};
const NEED_OF = Object.fromEntries(FOOD_DB.map(f => [f.k, f.needs]));
/* 选餐：口味是过滤器，对症是排序。
   选了口味 → 先在该口味候选里挑对症的，再顺延到同档位其他餐（也是对症的在前），"换一个"永远换得动。 */
function candidates(ev, taste) {
  /* 对症分：组合里最对症那样东西的排位（需求在标签里越靠前越对症），完全不对症记 9 */
  const fit = m => Math.min(9, ...m.map(k => { const i = NEED_OF[k].indexOf(ev.need); return i < 0 ? 9 : i; }));
  const byFit = list => list.slice().sort((a, b) => fit(a) - fit(b)); /* sort 是稳定的：同分保持原顺序 */
  const others = Object.values(COMBOS).map(c => c[ev.level]).flat();
  const pool = taste === "any" ? [ev.meal].concat(byFit(others)) : byFit(COMBOS[taste][ev.level]).concat(byFit([ev.meal].concat(others)));
  const seen = new Set();
  return pool.filter(m => { const k = m.join("+"); if (seen.has(k)) return false; seen.add(k); return true; });
}
/* 麦麦处方：为什么批这个。经典吃法组合有专属台词；否则取最对症的那样东西（需求在它标签里越靠前越对症，平手取主食）。 */
function prescription(keys, need, lang) {
  const L = I18N[lang], combo = L.combo[keys.slice().sort().join("+")];
  if (combo) return combo;
  let best = null, bi = 99;
  keys.forEach(k => { const i = (NEED_OF[k] || []).indexOf(need); if (i >= 0 && i < bi) { bi = i; best = k; } });
  /* 口味和情绪实在凑不到一起（如"被骂了 × 清淡"）：不硬套菜的台词，按情绪需求说一句 */
  return best ? L.line[best][need] : L.fallback[need];
}

/* 一句话 → 事件：按序关键词命中（中英都认）。顺序即优先级——"加班被骂"算被骂，"面试挂了/failed"算 emo 不算搞定。
   ponytail: 关键词表，够图一乐；Skill 版由 WorkBuddy 的大模型理解原话后直接注入 eventId。 */
const EVENT_RULES = [
  ["scolded", /骂|批评|挨|背锅|委屈|吵架|被怼|返工|甲方|\b(yell|scold|criticiz|blame|client)/i],
  ["emo",     /挂了|没过|失败|被拒|落榜|分手|失恋|\b(fail|reject|dumped|broke up|breakup)/i],
  ["ot",      /加班|通宵|熬夜|ddl|deadline|赶工|凌晨|夜班|\b(overtime|ot|all-nighter|late night|worked late|crunch)\b/i],
  ["done",    /上线|交付|搞定|完成|考完|答辩|面试|offer|发布|结项|通过|\b(shipped|launched|finished|nailed|passed|exam|got the job)\b/i],
  ["payday",  /工资|发薪|奖金|年终|到账|涨薪|\b(payday|paid|salary|bonus|raise)\b/i],
  ["workout", /跑步|健身|运动|游泳|骑行|打球|公里|撸铁|瑜伽|爬山|\b(gym|workout|worked out|ran|run|running|\d*km|yoga|swim|hike|exercise)\b/i],

/* 开屏问候：只用本机时间，不要任何权限，让第一句话就是在说"此刻的你" */
function greet(d, lang) {
  const g = I18N[lang].greet, h = d.getHours(), w = d.getDay(), fri = w === 5, weekend = w === 0 || w === 6;
  const time = String(h).padStart(2, "0") + ":" + String(d.getMinutes()).padStart(2, "0");
  const line =
    h < 5  ? g.night :
    h < 10 ? (w === 1 ? g.monday : g.morning) :
    h < 14 ? g.noon :
    h < 18 ? (fri ? g.friPm : weekend ? g.wkPm : g.pm) :
    h < 22 ? (fri ? g.friEve : g.eve) :
             g.late;
  return { time, line };
}

/* ---------- 批准书存图 ----------

function loadImg(src, cors) {

    i.src = src;
  });
}
/* 仓库内置食物图（menu-img.mcd.cn 快照 2026-10-10）：存图走同源，不脏 canvas，官方改 CDN 地址也不怕 */
const LOCAL_IMG = {
  bigmac: "food/bigmac.png", doubleCheese: "food/doubleCheese.png", grilled: "food/grilled.png", mcSpicy: "food/mcSpicy.png",
  mcChicken: "food/mcChicken.png", filet: "food/filet.png", fries: "food/fries.png", nuggets: "food/nuggets.png",
  wings: "food/wings.png", corn: "food/corn.png", flurry: "food/flurry.gif", sundae: "food/sundae.gif",
  cone: "food/cone.png", coke: "food/coke.gif", coffee: "food/coffee.png", appleJuice: "food/appleJuice.png"
};
async function mealImage(item) {
  /* file:// 直接打开时本地图也会让 canvas 变脏（opaque origin），跳过走 SVG 兜底 */
  if (item.k && LOCAL_IMG[item.k] && location.protocol !== "file:") {
    const l = await loadImg(LOCAL_IMG[item.k], false);
    if (l) return { img: l, sq: false };
  }
  if (item.img && imgState[item.img] !== "fail") {
    const p = await loadImg(item.img, true);
    if (p) return { img: p, sq: false };
  }
  /* 内联 SVG 不需要 xmlns，但作为图片文档加载必须带，否则静默加载失败 */
  const svg = artOf(item.k).replace("<svg ", '<svg xmlns="http://www.w3.org/2000/svg" ');
  const s = await loadImg("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg), false);
  return { img: s, sq: true }; /* 兜底插画是方图、无留白，缩到视觉等大 */
}
function rrect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y);
  c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r);
  c.closePath();
}
function wrapLines(c, text, maxW) {
  const out = []; let line = "";
  for (const ch of text) {
    if (line && c.measureText(line + ch).width > maxW) {
      /* 英文优先在空格处断行，别从单词中间劈开；中文没有空格，逐字断 */
      const sp = line.lastIndexOf(" ");
      if (sp > 0) { out.push(line.slice(0, sp)); line = line.slice(sp + 1) + ch; }
      else { out.push(line); line = ch; }
    } else line += ch;
  }
  if (line) out.push(line);
  return out;
}
/* 白边贴纸：离屏把图涂成白色剪影，八个方向叠画 = 沿轮廓长白边，再加软阴影 */
function drawSticker(c, img, cx, cy, w, rot, sq) {
  const iw = img.naturalWidth || img.width, ih = img.naturalHeight || img.height;
  let dw = w, dh = w * ih / iw;
  if (sq) { dw *= .66; dh *= .66; }
  const off = document.createElement("canvas");
  off.width = Math.ceil(dw) + 24; off.height = Math.ceil(dh) + 24;
  const o = off.getContext("2d");
  o.drawImage(img, 12, 12, dw, dh);
  o.globalCompositeOperation = "source-in";
  o.fillStyle = "#fff"; o.fillRect(0, 0, off.width, off.height);
  c.save();
  c.translate(cx, cy); c.rotate(rot);
  for (const [ox, oy] of [[-7,0],[7,0],[0,-7],[0,7],[-5,-5],[5,-5],[-5,5],[5,5]])
    c.drawImage(off, -dw / 2 - 12 + ox, -dh / 2 - 12 + oy);
  c.shadowColor = "rgba(0,0,0,.26)"; c.shadowBlur = 14; c.shadowOffsetY = 12;
  c.drawImage(img, -dw / 2, -dh / 2, dw, dh);
  c.restore();
}
let saving = false, saveURL = null;
async function saveCert() {
  if (!cur || !appr || saving) return;
  saving = true;
  buzz(12); SFX.coin();
  try {
    const photos = await Promise.all(cur.items.slice(0, 2).map(mealImage));
    const W = 750, M = 28, PW = W - M * 2, PAD = 40; /* 2 倍清晰度，和手机上的批准书同比例 */
    const F = (wt, s) => wt + " " + s + "px \"PingFang SC\",\"Microsoft YaHei\",system-ui,sans-serif";
    const tall = document.createElement("canvas");
    tall.width = W; tall.height = 2400;
    const c = tall.getContext("2d");
    c.textBaseline = "alphabetic";
    const setLS = v => { try { c.letterSpacing = v; } catch (e) {} };
    let y = M + PAD;
    const center = (txt, font, color, lh, ls, gap) => {
      y += (gap || 0);
      c.font = font; c.fillStyle = color; c.textAlign = "center"; setLS(ls || "0px");
      c.fillText(txt, W / 2, y + lh * .76);
      y += lh; setLS("0px");
    };
    /* 头（英文标题长，字距和字号收小，别撑出纸边） */
    center(T.certTitle, F(900, LANG === "zh" ? 46 : 38), "#DA291C", 52, LANG === "zh" ? "8px" : "2px");
    center(appr.no, F(600, 20), "#6E6259", 28, "2px", 4);
    if (appr.gold) {
      y += 8;
      const g = c.createLinearGradient(M + PAD, 0, W - M - PAD, 0);
      g.addColorStop(0, "rgba(255,233,168,0)"); g.addColorStop(.5, "#FFE9A8"); g.addColorStop(1, "rgba(255,233,168,0)");
      c.fillStyle = g; c.fillRect(M + PAD, y, PW - PAD * 2, 40);
      center(T.gold, F(900, 24), "#9A7000", 40, "4px");
      y += 8;
    }
    /* 信息行：dt 灰 + dd 黑，虚线分隔 */
    const row = (dt, dd, ddFont) => {
      y += 14;
      c.textAlign = "left"; setLS("0px");
      c.font = F(600, 26); c.fillStyle = "#6E6259";
      c.fillText(dt, M + PAD, y + 26 * .76);
      const ddX = M + PAD + Math.max(140, c.measureText(dt).width + 32); /* dt 多长，dd 就让多远 */
      c.font = ddFont || F(700, 26); c.fillStyle = "#1D1D1F";
      c.fillText(dd, ddX, y + 26 * .76);
      y += 26 + 14;
      c.strokeStyle = "#E8DCC6"; c.lineWidth = 2; c.setLineDash([6, 6]);
      c.beginPath(); c.moveTo(M + PAD, y); c.lineTo(W - M - PAD, y); c.stroke();
      c.setLineDash([]);
    };
    row(T.dtReason, appr.emo + "  " + appr.reason);
    row(T.dtLevel, "★".repeat(appr.level) + "☆".repeat(5 - appr.level), F(700, 26));
    if (appr.tasteLabel) row(T.dtTaste, appr.tasteLabel);
    /* 麦麦说 */
    y += 20;
    c.font = F(800, 30);
    const vLines = wrapLines(c, appr.verdict, PW - PAD * 2 - 56);
    const vH = 24 + 20 + vLines.length * 42 + 20;
    rrect(c, M + PAD, y, PW - PAD * 2, vH, 24);
    c.fillStyle = "#fff"; c.fill();
    c.strokeStyle = "#F0E3CB"; c.lineWidth = 2; c.stroke();
    c.textAlign = "center"; c.font = F(700, 18); c.fillStyle = "#6E6259"; setLS("4px");
    c.fillText(T.says, W / 2, y + 24 + 14); setLS("0px");
    c.font = F(800, 30); c.fillStyle = "#1D1D1F";
    vLines.forEach((ln, i) => c.fillText(ln, W / 2, y + 24 + 20 + 14 + i * 42 + 22));
    y += vH;
    /* 食物贴纸：配餐在后抬高，主食在前 */
    y += 30;
    const areaH = 300;
    if (photos[1]) drawSticker(c, photos[1].img, W / 2 + 160, y + areaH / 2 - 36, 300, .14, photos[1].sq);
    drawSticker(c, photos[0].img, W / 2 - (photos[1] ? 70 : 0), y + areaH / 2, photos[1] ? 420 : 460, -.105, photos[0].sq);
    y += areaH + 20;
    /* 餐名与处方 */
    center(T.mealPost + (cur.kcal != null ? " · " + T.kcal.replace("{n}", cur.kcal) : ""), F(800, 22), "#DA291C", 30, "4px");
    c.font = F(900, 34);
    wrapLines(c, cur.names, PW - PAD * 2).forEach(ln => center(ln, F(900, 34), "#1D1D1F", 46));
    if ($("certMeta").textContent) center($("certMeta").textContent, F(600, 22), "#6E6259", 30);
    if (appr.rx) {
      y += 10;
      c.font = F(700, 25);
      const pre = T.rxLabel + " ", preW = c.measureText(pre).width;
      const first = wrapLines(c, appr.rx, PW - PAD * 2 - 40 - preW);
      const lines = [first[0] || ""].concat(wrapLines(c, appr.rx.slice((first[0] || "").length), PW - PAD * 2 - 40));
      const rxH = lines.length * 36 + 22;
      const rxW = PW - PAD * 2 - 40;
      rrect(c, W / 2 - rxW / 2 - 20, y, rxW + 40, rxH, 20);
      c.fillStyle = "rgba(255,199,44,.25)"; c.fill();
      c.textAlign = "left";
      lines.forEach((ln, i) => {
        const ly = y + 11 + i * 36 + 25 * .76;
        if (i === 0) {
          c.font = F(900, 25); c.fillStyle = "#DA291C"; c.fillText(T.rxLabel, W / 2 - rxW / 2, ly);
          c.font = F(700, 25); c.fillStyle = "#1D1D1F"; c.fillText(ln, W / 2 - rxW / 2 + preW, ly);
        } else { c.font = F(700, 25); c.fillStyle = "#1D1D1F"; c.fillText(ln, W / 2 - rxW / 2, ly); }
      });
      y += rxH;
    }
    /* 价格：和页面上同一套规则 */
    y += 26;
    const f1 = n => Number(n).toFixed(1);
    c.textAlign = "left"; setLS("0px");
    if (cur.realMenu && cur.saved > 0) {
      const sT = T.store + " ¥" + f1(cur.base), bT = T.after + " ¥" + f1(cur.price), eT = T.saved + f1(cur.saved);
      c.font = F(600, 24);
      const sW = c.measureText(sT).width;
      c.font = F(900, 44);
      const bW = c.measureText(bT).width;
      c.font = F(800, 22);
      const eW = c.measureText(eT).width + 28;
      let px = W / 2 - (sW + 16 + bW + 16 + eW) / 2;
      c.font = F(600, 24); c.fillStyle = "#6E6259";
      c.fillText(sT, px, y + 24 * .76);
      c.strokeStyle = "#6E6259"; c.lineWidth = 2;
      c.beginPath(); c.moveTo(px, y + 8); c.lineTo(px + sW, y + 8); c.stroke();
      px += sW + 16;
      c.font = F(900, 44); c.fillStyle = "#DA291C";
      c.fillText(bT, px, y + 44 * .76 + 4);
      px += bW + 16;
      rrect(c, px, y - 2, eW, 34, 17);
      c.fillStyle = "#1D9E75"; c.fill();
      c.font = F(800, 22); c.fillStyle = "#fff";
      c.fillText(eT, px + 14, y - 2 + 34 / 2 + 22 * .36);
      y += 52;
    } else {
      const pT = (cur.realMenu ? T.paid : T.store) + " ¥" + f1(cur.price);
      c.font = F(800, 30);
      const pW = c.measureText(pT).width;
      let hW = 0;
      if (!cur.realMenu) { c.font = F(700, 22); hW = c.measureText(T.priceHint).width + 32; }
      let px = W / 2 - (pW + (hW ? 16 + hW : 0)) / 2;
      c.font = F(800, 30); c.fillStyle = "#1D1D1F";
      c.fillText(pT, px, y + 30 * .76);
      px += pW + 16;
      if (hW) {
        rrect(c, px, y - 2, hW, 36, 18);
        c.fillStyle = "rgba(218,41,28,.08)"; c.fill();
        c.font = F(700, 22); c.fillStyle = "#DA291C";
        c.fillText(T.priceHint, px + 16, y - 2 + 18 + 22 * .36);
      }
      y += 48;
    }
    /* 落款 */
    y += 16;
    c.strokeStyle = "#E8DCC6"; c.lineWidth = 2; c.setLineDash([6, 6]);
    c.beginPath(); c.moveTo(M + PAD, y); c.lineTo(W - M - PAD, y); c.stroke();
    c.setLineDash([]);
    y += 22;
    c.textAlign = "left"; c.font = F(600, 22); c.fillStyle = "#6E6259";
    c.fillText(T.sign, M + PAD, y + 22 * .76);
    y += 34;
    center(T.src, F(600, 18), "#B4A795", 26, "1px");
    /* 大章：右上角斜盖，红色/金色，multiply 感靠透明度 */
    c.save();
    c.translate(W - M - 150, M + 190);
    c.rotate(-.28);
    c.globalAlpha = .88;
    const sc = appr.gold ? "#B8860B" : "#DA291C";
    c.strokeStyle = sc; c.fillStyle = sc;
    c.lineWidth = 8; c.beginPath(); c.arc(0, 0, 118, 0, 7); c.stroke();
    c.lineWidth = 5; c.beginPath(); c.arc(0, 0, 96, 0, 7); c.stroke();
    c.textAlign = "center";
    const sLines = (appr.gold ? T.stampGold : T.stamp).split(/<br\s*\/?>/i);
    c.font = F(900, LANG === "zh" ? 56 : 34); setLS(LANG === "zh" ? "6px" : "1px"); /* 英文单词长，字号收小才进得了章圈 */
    sLines.forEach((ln, i) => c.fillText(ln, 2, (i - (sLines.length - 1) / 2) * (LANG === "zh" ? 58 : 40) + (LANG === "zh" ? 20 : 12)));
    setLS("0px");
    c.font = F(800, 18);
    c.fillText(appr.dateStr, 0, sLines.length * (LANG === "zh" ? 30 : 22) + 26);
    c.restore();
    /* 内容画完了，按实际高度出终稿：红底 + 纸卡 + 内容 */
    const H = y + PAD + M;
    const out = document.createElement("canvas");
    out.width = W; out.height = H;
    const o = out.getContext("2d");
    o.fillStyle = "#DA291C"; o.fillRect(0, 0, W, H);
    rrect(o, M, M, PW, H - M * 2, 20);
    o.fillStyle = "#FFF9EE"; o.fill();
    rrect(o, M + 16, M + 16, PW - 32, H - M * 2 - 32, 10);
    o.strokeStyle = "rgba(218,41,28,.3)"; o.lineWidth = 3; o.stroke();
    o.drawImage(tall, 0, 0, W, H, 0, 0, W, H);
    out.toBlob(b => {
      if (!b) { saving = false; return; }
      if (saveURL) URL.revokeObjectURL(saveURL);
      saveURL = URL.createObjectURL(b);
      $("saveImg").src = saveURL;
      const dl = $("saveDl");
      dl.href = saveURL;
      dl.download = (LANG === "zh" ? "麦麦批准-" : "mcapproved-") + todayStr() + ".png";
      $("saveLayer").classList.add("on");
      SFX.sheet();
      saving = false;
    }, "image/png");
  } catch (e) { if (window.console) console.error("saveCert", e); saving = false; }
}
$("saveBtn").onclick = saveCert;
$("saveClose").onclick = () => { buzz(8); SFX.back(); $("saveLayer").classList.remove("on"); };
$("saveLayer").onclick = e => { if (e.target === $("saveLayer")) $("saveLayer").classList.remove("on"); };

/* 庆祝：底部烟花升空 + 顶部彩纸飘落，零图片零依赖 */
function launchFireworks(colors) {
  const layer = $("fwLayer");
  const spawn = () => {
    const burst = document.createElement("div");
    burst.className = "fw-burst";
    burst.style.left = (14 + Math.random() * 68) + "%";
    burst.style.setProperty("--peak", (28 + Math.random() * 34) + "vh");
    const n = 12 + Math.floor(Math.random() * 6);
    for (let i = 0; i < n; i++) {
      const s = document.createElement("i");
      const ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const dist = 36 + Math.random() * 46;
      s.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
      s.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(1) + "px");
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = (0.52 + Math.random() * 0.08) + "s";
      burst.appendChild(s);
    }
    layer.appendChild(burst);
    setTimeout(() => burst.remove(), 2000);
  };
  spawn();
  setTimeout(spawn, 180);
  setTimeout(spawn, 380);
}
function confetti(colors) {
  const layer = $("fwLayer");
  for (let i = 0; i < 42; i++) {
    const c = document.createElement("b");
    c.className = "cf";
    c.style.left = (Math.random() * 100).toFixed(1) + "%";
    c.style.background = colors[i % colors.length];
    c.style.setProperty("--x", (Math.random() * 80 - 40).toFixed(0) + "px");
    c.style.setProperty("--rot", (Math.random() * 720 - 360).toFixed(0) + "deg");
    c.style.animationDelay = (Math.random() * .35).toFixed(2) + "s";
    c.style.animationDuration = (1.6 + Math.random() * 1.2).toFixed(2) + "s";
    layer.appendChild(c);
    setTimeout(() => c.remove(), 3400);
  }
}

/* ---------- Stage 3：领券下单 ---------- */
$("goDeal").onclick = () => {
  buzz(12);
  SFX.sheet();
  SFX.coin();
  $("dealMeal").textContent = cur.names + (cur.kcal != null ? " · " + T.kcal.replace("{n}", cur.kcal) : "");
  fillFood($("dealFood"), $("certFood").innerHTML); /* 复用批准书上已出图/已换插画的结果，不重新请求 */
  const row = $("couponRow");
  row.innerHTML = "";
  if (cur.realMenu && cur.coupons > 0) {
    /* 券名用 Skill 注入的真实名字；没给就统称麦麦省券，不编造券种 */
    const names = (D && D.couponNames) || [];
    for (let i = 0; i < Math.min(cur.coupons, 3); i++) {
      const c = document.createElement("div");
      c.className = "coupon";
      c.textContent = (names[i] || T.couponName) + T.couponGot;
      row.appendChild(c);
    }
  } else {
    const c = document.createElement("div");
    c.className = "coupon";
    c.textContent = T.couponDemo;
    row.appendChild(c);
  }
  const deal = cur.realMenu && cur.saved > 0;
  $("dealLbl").textContent = deal ? T.after : (cur.realMenu ? T.paid : T.store); /* 真实菜单无券可用时和批准书一致说「实付」 */
  $("dealNow").textContent = "¥" + Number(cur.price).toFixed(1);
  $("dealNow").className = "now" + (deal ? "" : " plain");
  $("dealWas").textContent = deal ? T.store + " ¥" + Number(cur.base).toFixed(1) : "";
  $("dealSave").textContent = deal ? T.saved + Number(cur.saved).toFixed(1) : "";
  goTo("deal");
};
$("dealUnderlay").onclick = () => { SFX.back(); goTo("approve"); };
$("replayBtn").onclick = () => { buzz(8); SFX.back(); toAsk(); };
$("orderBtn").onclick = () => {
  buzz([15, 50, 15]);
  SFX.order();
  setTimeout(() => alert(T.orderAlert), 350); /* 等叮咚响完再弹窗，alert 会冻结音频 */
};

/* ---------- 启动：Skill 注入了 eventId 就直接盖章 ---------- */
preload(FOOD_DB.concat((D && D.meals) || []));
applyText();
buildAsk();
if (D && D.eventId) {
  const ev = EVENTS.find(e => e.id === D.eventId) || EVENT_MISC;
  approve(ev, D.reason || evText(ev).label, D.taste || "any");
}
