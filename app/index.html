<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>麦麦批准 · 今天这顿，麦当劳批了</title>
<style>
  :root {
    --red: #DA291C;
    --red-dark: #B01E12;
    --yellow: #FFC72C;
    --cream: #F5F5F7;
    --paper: #FFFDF8;
    --ink: #1D1D1F;
    --ink-soft: #6E6259;
    --line: #E8E0D2;
    --green: #1D9E75;
    --spring: cubic-bezier(.34, 1.56, .64, 1);
    --sheet: cubic-bezier(.32, .72, 0, 1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  /* html 也要 hidden：否则 body 的 overflow 会转交给视口，藏在屏幕下方的抽屉撑出滚动区，
     输入框聚焦时整页被滚走露出黑边。body 用 clip（不可被程序滚动），hidden 兜底老浏览器 */
  html { height: 100%; overflow: hidden; }
  body {
    height: 100%;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background: #000; color: var(--ink);
    max-width: 430px; margin: 0 auto;
    overflow: hidden; overflow: clip; position: relative;
    user-select: none; -webkit-user-select: none;
  }
  button { font-family: inherit; }
  .stage {
    position: absolute; inset: 0;
    display: flex; flex-direction: column;
    opacity: 0; pointer-events: none;
    transform: translateY(12px) scale(.985);
    transition: opacity .26s ease, transform .26s var(--sheet);
  }
  .stage.on { opacity: 1; pointer-events: auto; transform: none; }
  .back {
    position: absolute; top: max(14px, env(safe-area-inset-top)); left: 14px; z-index: 50;
    width: 36px; height: 36px; border-radius: 50%; border: none; cursor: pointer;
    background: rgba(120,120,128,.16);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--ink); font-size: 18px; display: none; align-items: center; justify-content: center;
  }
  .dots { position: absolute; top: max(24px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; gap: 7px; z-index: 50; }
  .dots i { width: 7px; height: 7px; border-radius: 50%; background: rgba(120,120,128,.3); transition: all .3s; }
  .dots i.on { background: var(--red); width: 20px; border-radius: 4px; }

  /* ===== iOS 按压反馈：所有可点元素统一 scale + 压暗 ===== */
  .ev, .back, .order-btn, .replay button, .say button {
    transition: transform .14s var(--spring), filter .14s ease, opacity .2s ease, background .2s, color .2s;
  }
  .ev:active, .back:active, .replay button:active, .say button:active { transform: scale(.94); filter: brightness(.9); }
  .order-btn:active { transform: scale(.96); filter: brightness(.95); }

  /* ===== Stage 1 今天发生了什么 ===== */
  #st-ask { background: var(--cream); padding: 64px 22px max(20px, env(safe-area-inset-bottom)); overflow-y: auto; }
  #st-ask .kicker { font-size: 12px; letter-spacing: 3px; color: var(--ink-soft); font-weight: 700; }
  #st-ask h1 { font-size: 30px; font-weight: 800; margin-top: 8px; }
  #st-ask .sub { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
  .ev-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 22px; }
  .ev {
    border: none; border-radius: 18px; padding: 15px 14px; background: #fff; color: var(--ink);
    text-align: left; cursor: pointer; box-shadow: 0 1px 3px rgba(0,0,0,.06);
  }
  .ev .emo { font-size: 26px; display: block; line-height: 1; }
  .ev b { display: block; font-size: 16px; margin-top: 9px; }
  .ev small { display: block; font-size: 11px; color: var(--ink-soft); margin-top: 3px; }
  .ev.pick { background: var(--red); color: #fff; }
  .ev.pick small { color: rgba(255,255,255,.75); }
  .say { display: flex; gap: 8px; margin-top: 14px; }
  .say input {
    flex: 1; min-width: 0; border: none; background: #fff; border-radius: 14px; padding: 13px 16px;
    font-size: 16px; font-family: inherit; outline: none; box-shadow: 0 1px 3px rgba(0,0,0,.06);
    user-select: text; -webkit-user-select: text; /* iOS：父级禁选会导致输入框打不了字 */
  }
  .say button { border: none; border-radius: 14px; padding: 0 18px; background: var(--ink); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; }
  .foot-note { text-align: center; font-size: 10px; color: #B4A795; margin-top: 22px; }

  /* ===== Stage 2 批准书 ===== */
  #st-approve { background: var(--cream); align-items: center; padding: 60px 18px max(18px, env(safe-area-inset-bottom)); overflow-y: auto; }
  .cert-wrap { width: 100%; max-width: 380px; transform: translateY(40px); opacity: 0; flex-shrink: 0; }
  #st-approve.on .cert-wrap { animation: certIn .5s var(--sheet) .05s forwards; }
  @keyframes certIn { to { transform: none; opacity: 1; } }
  .cert {
    position: relative; background: var(--paper); border-radius: 8px;
    padding: 24px 24px 16px; box-shadow: 0 14px 36px rgba(0,0,0,.12);
  }
  .cert::before { content: ""; position: absolute; inset: 8px; border: 1.5px solid rgba(218,41,28,.3); border-radius: 4px; pointer-events: none; }
  .cert.shake { animation: certShake .28s ease; }
  @keyframes certShake { 30% { transform: translateY(3px) rotate(-.4deg); } 60% { transform: translateY(-1px) rotate(.2deg); } }
  .cert-head { text-align: center; }
  .cert-head .t { font-size: 22px; font-weight: 900; letter-spacing: 4px; color: var(--red); }
  .cert-head .no { font-size: 10px; color: var(--ink-soft); margin-top: 4px; letter-spacing: 1px; font-variant-numeric: tabular-nums; }
  .cert dl { margin-top: 8px; }
  .cert-row { display: flex; gap: 10px; font-size: 13px; line-height: 1.5; padding: 7px 0; border-bottom: 1px dashed var(--line); }
  .cert-row dt { color: var(--ink-soft); flex-shrink: 0; width: 60px; }
  .cert-row dd { font-weight: 700; flex: 1; word-break: break-all; }
  .cert-row .stars { color: var(--red); letter-spacing: 2px; }
  .cert-verdict {
    margin-top: 14px; padding: 12px 14px; background: #fff; border-radius: 12px;
    font-size: 15px; font-weight: 700; text-align: center; box-shadow: inset 0 0 0 1px #F0E6D4;
  }
  .cert-food { display: flex; align-items: flex-end; justify-content: center; margin-top: 16px; min-height: 140px; }
  .cert-food .photo-a .photo-frame { width: 150px; }
  .cert-food .photo-b .photo-frame { width: 108px; }
  .cert-food .photo-b { margin-left: -26px; }
  /* 食物照片像贴纸一样"啪"地贴上批准书 */
  .cert-food > div { opacity: 0; transform: scale(.4) rotate(-24deg); }
  #st-approve.on .cert-food > div { animation: foodStick .5s var(--spring) .45s forwards; }
  #st-approve.on .cert-food .photo-b { animation-delay: .6s; }
  @keyframes foodStick { to { opacity: 1; transform: rotate(var(--r)); } }
  .cert-meal { text-align: center; font-size: 15px; font-weight: 800; margin-top: 12px; }
  .cert-meta { text-align: center; font-size: 11px; color: var(--ink-soft); margin-top: 4px; }
  .cert-sign { display: flex; justify-content: space-between; font-size: 11px; color: var(--ink-soft); margin-top: 16px; padding-top: 10px; border-top: 1px dashed var(--line); }
  .cert-src { text-align: center; font-size: 9px; color: #B4A795; margin-top: 10px; letter-spacing: .5px; }
  .stamp {
    position: absolute; right: 22px; bottom: 26px; width: 92px; height: 92px; border-radius: 50%;
    border: 3px solid var(--red); box-shadow: inset 0 0 0 3px var(--paper), inset 0 0 0 5px var(--red);
    color: var(--red); display: flex; flex-direction: column; align-items: center; justify-content: center;
    opacity: 0; transform: rotate(-14deg) scale(2.6); mix-blend-mode: multiply; pointer-events: none;
  }
  .stamp b { font-size: 21px; font-weight: 900; letter-spacing: 2px; line-height: 1.05; text-align: center; }
  .stamp small { font-size: 8px; font-weight: 700; margin-top: 3px; }
  .stamp.hit { animation: stampHit .3s cubic-bezier(.5, 0, .75, 0) forwards; }
  @keyframes stampHit {
    0%   { opacity: 0; transform: rotate(-14deg) scale(2.6); }
    60%  { opacity: .95; }
    100% { opacity: .88; transform: rotate(-14deg) scale(1); }
  }
  .approve-cta { width: 100%; max-width: 380px; flex-shrink: 0; opacity: 0; pointer-events: none; transition: opacity .3s; }
  .approve-cta.on { opacity: 1; pointer-events: auto; }

  /* ===== 白边模切照片（批准书 + 领券抽屉共用）===== */
  .photo-a { --r: -4deg; transform: rotate(var(--r)); z-index: 2; }
  .photo-b { --r: 5deg; transform: rotate(var(--r)); z-index: 3; }
  .photo-frame {
    background: #fff; padding: 10px;
    border-radius: 44% 56% 52% 48% / 50% 46% 54% 50%;
    box-shadow: 0 6px 16px rgba(0,0,0,.14), 0 0 0 5px #fff;
  }
  .photo-frame img, .photo-frame svg {
    width: 100%; aspect-ratio: 1; object-fit: cover; display: block; background: #fff;
    border-radius: 44% 56% 52% 48% / 50% 46% 54% 50%;
  }

  /* ===== 底部烟花（纯 CSS，盖章时庆祝）===== */
  /* absolute 而非 fixed：约束在 430px 机身内，桌面宽屏不放飞 */
  .fw-layer { position: absolute; inset: 0; pointer-events: none; z-index: 70; overflow: hidden; }
  .fw-burst {
    position: absolute; bottom: -12px; left: 50%; width: 0; height: 0;
    animation: fwRise .55s cubic-bezier(.18,.72,.3,1) forwards;
  }
  @keyframes fwRise { to { transform: translateY(calc(-1 * var(--peak, 46vh))); } }
  .fw-burst i {
    position: absolute; width: 6px; height: 6px; margin: -3px; border-radius: 50%;
    opacity: 0; animation: fwSpark .85s ease-out forwards;
  }
  @keyframes fwSpark {
    0%   { opacity: 1; transform: translate(0, 0) scale(1.2); }
    70%  { opacity: .9; }
    100% { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.25); }
  }

  /* ===== 领券抽屉 ===== */
  #st-deal { justify-content: flex-end; z-index: 60; }
  #st-deal .underlay { position: absolute; inset: 0; background: rgba(0,0,0,.45); opacity: 0; transition: opacity .3s; }
  #st-deal.on .underlay { opacity: 1; }
  .sheet {
    position: relative; background: var(--cream); border-radius: 26px 26px 0 0;
    padding: 12px 24px max(30px, env(safe-area-inset-bottom));
    transform: translateY(105%); transition: transform .42s var(--sheet);
    max-height: 86%; overflow-y: auto;
  }
  #st-deal.on .sheet { transform: translateY(0); }
  .grabber { width: 38px; height: 5px; border-radius: 3px; background: rgba(0,0,0,.15); margin: 4px auto 18px; }
  .sheet h2 { font-size: 24px; font-weight: 800; }
  .sheet .sub2 { font-size: 13px; color: var(--ink-soft); margin-top: 6px; }
  .deal-food { display: flex; align-items: flex-end; justify-content: center; margin-top: 18px; }
  .deal-food .photo-a .photo-frame { width: 150px; }
  .deal-food .photo-b .photo-frame { width: 110px; }
  .deal-food .photo-b { margin-left: -28px; }
  .coupon-row { display: flex; gap: 10px; margin-top: 18px; overflow-x: auto; padding-bottom: 4px; }
  .coupon {
    flex-shrink: 0; background: #FFF4D6; border: 1.5px dashed #E8B93B; border-radius: 12px;
    padding: 10px 14px; font-size: 12px; font-weight: 700; color: #7A5B0B;
  }
  .price-line { display: flex; align-items: baseline; gap: 10px; margin-top: 18px; }
  .price-line .now { font-size: 34px; font-weight: 800; color: var(--red); }
  .price-line .was { font-size: 14px; color: var(--ink-soft); text-decoration: line-through; }
  .price-line .save { font-size: 12px; font-weight: 800; color: var(--green); }
  .order-btn {
    display: block; width: 100%; margin-top: 18px; padding: 17px; border: none; cursor: pointer;
    background: var(--yellow); color: var(--ink); font-size: 17px; font-weight: 800;
    border-radius: 16px; letter-spacing: 1px;
  }
  .share-line { text-align: center; font-size: 12px; color: var(--ink-soft); margin-top: 14px; }
  .star-link { display: block; text-align: center; font-size: 13px; font-weight: 700; color: var(--ink); margin-top: 10px; text-decoration: none; }
  .replay { text-align: center; margin-top: 10px; }
  .replay button { border: none; background: none; color: var(--ink-soft); font-size: 13px; cursor: pointer; text-decoration: underline; padding: 6px; }
</style>
</head>
<body>

<div class="dots" id="dots"><i class="on"></i><i></i><i></i></div>
<button class="back" id="backBtn" aria-label="返回">‹</button>
<div class="fw-layer" id="fwLayer"></div>

<!-- Stage 1：今天发生了什么 -->
<section class="stage on" id="st-ask">
  <div class="kicker">麦麦批准 · McAPPROVED</div>
  <h1>今天发生了什么？</h1>
  <div class="sub">说一件事，麦麦给你批一顿</div>
  <div class="ev-grid" id="evGrid"></div>
  <div class="say">
    <input id="sayText" maxlength="40" placeholder="或者一句话说说今天" enterkeyhint="done" aria-label="一句话说说今天">
    <button id="sayBtn">批一下</button>
  </div>
  <div class="foot-note">非官方粉丝作品 · 与金拱门（中国）无关</div>
</section>

<!-- Stage 2：批准书 -->
<section class="stage" id="st-approve">
  <div class="cert-wrap">
    <div class="cert" id="cert">
      <div class="cert-head">
        <div class="t">麦麦犒劳批准书</div>
        <div class="no" id="certNo"></div>
      </div>
      <dl>
        <div class="cert-row"><dt>申请人</dt><dd>今天的你</dd></div>
        <div class="cert-row"><dt>申请事由</dt><dd id="certReason"></dd></div>
        <div class="cert-row"><dt>犒劳指数</dt><dd class="stars" id="certStars"></dd></div>
      </dl>
      <div class="cert-verdict" id="certVerdict"></div>
      <div class="cert-food" id="certFood"></div>
      <div class="cert-meal" id="certMeal"></div>
      <div class="cert-meta" id="certMeta"></div>
      <div class="cert-sign"><span>审批：麦麦批准处</span></div>
      <div class="cert-src">麦麦批准 McApproved · github.com/pakco77/mctrack</div>
      <div class="stamp" id="stamp"><b>麦麦<br>批准</b><small id="stampDate"></small></div>
    </div>
  </div>
  <div class="approve-cta" id="approveCta">
    <button class="order-btn" id="goDeal">领券去吃 →</button>
    <div class="replay"><button id="againBtn">换个理由</button></div>
  </div>
</section>

<!-- Stage 3：领券下单 -->
<section class="stage" id="st-deal">
  <div class="underlay" id="dealUnderlay"></div>
  <div class="sheet">
    <div class="grabber"></div>
    <h2>批准已生效</h2>
    <div class="sub2" id="dealMeal">—</div>
    <div class="deal-food" id="dealFood"></div>
    <div class="coupon-row" id="couponRow"></div>
    <div class="price-line">
      <span class="now" id="dealNow">¥0</span>
      <span class="was" id="dealWas"></span>
      <span class="save" id="dealSave"></span>
    </div>
    <button class="order-btn" id="orderBtn">一键下单 · 就吃这个</button>
    <div class="share-line">截图批准书发群：今天这顿，是麦当劳批的</div>
    <a class="star-link" href="https://github.com/pakco77/mctrack" target="_blank" rel="noopener">⭐ 好玩的话，去 GitHub 点个 Star</a>
    <div class="replay"><button id="replayBtn">换个理由再批一次</button></div>
  </div>
</section>

<!-- Skill 注入点：替换为 JSON；未注入（直接打开 / GitHub Pages）时解析失败 → 走内置快照 -->
<script type="application/json" id="mc-data">__MCTRACK_DATA__</script>
<script>
/* @pure-begin 纯数据与纯函数（verify.py 会单独抽出来跑断言） */

  { id: "nothing", emo: "🍦", label: "啥也没干",     sub: "就是想吃",         level: 1, meal: ["cone"],                   verdict: "想吃不需要理由，但只够批一个甜筒" }
];
/* 一句话没命中任何事件：照抄原话上批准书，给一份标准餐 */
const EVENT_MISC = { id: "misc", label: "说不清，但值得一顿", level: 3, meal: ["filet", "coke"], verdict: "这事儿值一顿，批了" };

/* 一句话 → 事件：按序关键词命中。顺序即优先级——"加班被骂"算被骂，"面试挂了"算 emo 不算搞定。
   ponytail: 关键词表，够图一乐；Skill 版由 WorkBuddy 的大模型理解原话后直接注入 eventId。 */
const EVENT_RULES = [
  ["scolded", /骂|批评|挨|背锅|委屈|吵架|被怼|返工|甲方/],
  ["emo",     /挂了|没过|失败|被拒|落榜|分手|失恋/],
  ["ot",      /加班|通宵|熬夜|ddl|deadline|赶工|凌晨|夜班/i],
  ["done",    /上线|交付|搞定|完成|考完|答辩|面试|offer|发布|结项|通过/i],
  ["payday",  /工资|发薪|奖金|年终|到账|涨薪/],
  ["workout", /跑步|健身|运动|游泳|骑行|打球|公里|撸铁|瑜伽|爬山/],
  ["rain",    /雨|冷|降温|下雪|台风/],
  ["emo",     /emo|难过|伤心|想哭|丧|焦虑|烦|孤独|累/i],
  ["nothing", /没干|无聊|想吃|馋|没事/]
];
function matchEvent(text) {
  for (const [id, re] of EVENT_RULES) if (re.test(text)) return id;
  return "misc";
}
/* @pure-end */

/* 贴纸插画（扁平 SVG）：菜单图加载失败时的兜底 */
const ART = {
  burger: () => `<svg viewBox="0 0 100 100"><path d="M15 42a35 16 0 0 1 70 0v4H15z" fill="#E8A33D"/><rect x="13" y="46" width="74" height="7" rx="3.5" fill="#4C9A2A"/><rect x="15" y="53" width="70" height="11" rx="3" fill="#7A4A21"/><rect x="15" y="64" width="70" height="6" rx="3" fill="#F4C33D"/><path d="M15 70h70v3a10 10 0 0 1-10 10H25a10 10 0 0 1-10-10z" fill="#E8A33D"/></svg>`,
  spicy:  () => `<svg viewBox="0 0 100 100"><path d="M15 42a35 16 0 0 1 70 0v4H15z" fill="#E8A33D"/><path d="M15 46h70v7H15z" fill="#DA291C"/><rect x="15" y="53" width="70" height="11" rx="3" fill="#C94F1E"/><rect x="15" y="64" width="70" height="6" rx="3" fill="#F4C33D"/><path d="M15 70h70v3a10 10 0 0 1-10 10H25a10 10 0 0 1-10-10z" fill="#E8A33D"/><path d="M30 30c2-4 6-4 8 0M46 26c2-4 6-4 8 0M62 30c2-4 6-4 8 0" stroke="#DA291C" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  fries:  () => `<svg viewBox="0 0 100 100"><path d="M35 20h6v30h-6zM46 14h6v34h-6zM57 18h6v30h-6zM28 26h6v24h-6zM66 26h6v24h-6z" fill="#F4C33D"/><path d="M25 46h50l-6 38a6 6 0 0 1-6 5H37a6 6 0 0 1-6-5z" fill="#DA291C"/><path d="M42 58h16l-2 12H44z" fill="#FFC72C"/></svg>`,
  drink:  () => `<svg viewBox="0 0 100 100"><path d="M30 30h40l-4 56a6 6 0 0 1-6 5H40a6 6 0 0 1-6-5z" fill="#B01E12"/><path d="M33 44h34l-1 14H34z" fill="#F2E3C6" opacity=".35"/><path d="M45 12h6v20h-6z" fill="#eee" transform="rotate(12 48 22)"/><path d="M28 30h44v6H28z" fill="#eee"/></svg>`,
  coffee: () => `<svg viewBox="0 0 100 100"><path d="M26 38h44v24a16 16 0 0 1-16 16h-12a16 16 0 0 1-16-16z" fill="#fff" stroke="#2B2420" stroke-width="3.5"/><path d="M70 42h6a9 9 0 0 1 0 18h-7" fill="none" stroke="#2B2420" stroke-width="3.5"/><path d="M38 30c2-5-2-7 0-12M50 30c2-5-2-7 0-12" stroke="#B4A795" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M26 46h44v6H26z" fill="#6E4A2B"/></svg>`,
  icecream: () => `<svg viewBox="0 0 100 100"><path d="M50 55L36 92h28z" fill="#E8A33D"/><path d="M38 88h24M42 78h16M46 68h8" stroke="#C9853B" stroke-width="2.5"/><circle cx="50" cy="42" r="20" fill="#F4E9D8"/><circle cx="38" cy="50" r="10" fill="#F4E9D8"/><circle cx="62" cy="50" r="10" fill="#F4E9D8"/><circle cx="44" cy="36" r="4" fill="#DA291C"/><circle cx="57" cy="44" r="4" fill="#7A4A21"/></svg>`,
  wings:  () => `<svg viewBox="0 0 100 100"><path d="M28 30c14-8 34-4 42 10s4 34-10 42-34 4-42-10-4-34 10-42z" fill="#C94F1E"/><path d="M36 40c8-4 20-2 25 6M33 52c10-5 26-2 32 8" stroke="#8F3413" stroke-width="3.5" fill="none" stroke-linecap="round"/><path d="M30 26c2-4 6-4 8 0M48 20c2-4 6-4 8 0" stroke="#DA291C" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`,
  nuggets: () => `<svg viewBox="0 0 100 100"><path d="M22 34a14 14 0 0 1 28 0v6H22z" fill="#E8A33D"/><rect x="18" y="40" width="36" height="6" rx="3" fill="#4C9A2A"/><rect x="20" y="46" width="32" height="9" rx="3" fill="#7A4A21"/><rect x="20" y="55" width="32" height="5" rx="2.5" fill="#F4C33D"/><path d="M20 60h32v2a8 8 0 0 1-8 8H28a8 8 0 0 1-8-8z" fill="#E8A33D"/><rect x="58" y="52" width="26" height="20" rx="4" fill="#DA291C"/><path d="M63 52v20" stroke="#FFC72C" stroke-width="3"/><circle cx="71" cy="47" r="8" fill="#F4C33D"/><circle cx="81" cy="44" r="7" fill="#F4C33D"/></svg>`
};
const MEAL_ART = { bigmac: "burger", doubleCheese: "burger", grilled: "burger", filet: "burger", mcChicken: "burger", mcSpicy: "spicy", wings: "wings", nuggets: "nuggets", fries: "fries", flurry: "icecream", sundae: "icecream", cone: "icecream", coke: "drink", appleJuice: "drink", coffee: "coffee" };

/* ---------- 状态 ---------- */
const $ = id => document.getElementById(id);
const D = (() => { try { return JSON.parse($("mc-data").textContent); } catch (e) { return null; } })();
let stage = "ask", cur = null, seq = [];

function hashStr(s) { let h = 5381; for (let i = 0; i < s.length; i++) h = ((h << 5) + h + s.charCodeAt(i)) >>> 0; return h; }
function todayStr() { const d = new Date(); return d.getFullYear() + String(d.getMonth()+1).padStart(2,"0") + String(d.getDate()).padStart(2,"0"); }
/* 触感反馈：支持的设备上点按给一点震动，不支持就静默跳过 */
function buzz(p) { if (navigator.vibrate) { try { navigator.vibrate(p); } catch (e) {} } }
/* 盖章闷响：Web Audio 合成，无音频文件。iOS 不支持震动，靠这一声给反馈。
   AudioContext 必须在用户点按时创建/唤醒（unlockAudio），否则 Safari 静音。 */
let actx = null;
function unlockAudio() {
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    if (actx.state === "suspended") actx.resume();
  } catch (e) {}
}
function thud() {
  if (!actx || actx.state !== "running") return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = "sine";
  o.frequency.setValueAtTime(140, t);
  o.frequency.exponentialRampToValueAtTime(40, t + .15);
  g.gain.setValueAtTime(.8, t);
  g.gain.exponentialRampToValueAtTime(.001, t + .2);
  o.connect(g); g.connect(actx.destination); o.start(t); o.stop(t + .22);
}

/* ---------- 舞台机 ---------- */
const ORDER = ["ask", "approve", "deal"];
function goTo(name) {
  stage = name;
  ORDER.forEach(s => $("st-" + s).classList.toggle("on", s === name || (name === "deal" && s === "approve")));
  const idx = ORDER.indexOf(name);
  document.querySelectorAll("#dots i").forEach((d, i) => d.classList.toggle("on", i <= idx));
  $("backBtn").style.display = name === "approve" ? "flex" : "none";
}
function toAsk() {
  seq.forEach(clearTimeout); seq = [];
  document.querySelectorAll(".ev").forEach(x => x.classList.remove("pick"));
  goTo("ask");
}
$("backBtn").onclick = () => { buzz(8); toAsk(); };

/* ---------- Stage 1：今天发生了什么 ---------- */
function buildEvents() {
  const g = $("evGrid");
  g.innerHTML = "";
  EVENTS.forEach(ev => {
    const b = document.createElement("button");
    b.className = "ev";
    b.innerHTML = '<span class="emo">' + ev.emo + "</span><b>" + ev.label + "</b><small>" + ev.sub + "</small>";
    b.onclick = () => {
      buzz(10);
      unlockAudio();
      document.querySelectorAll(".ev").forEach(x => x.classList.remove("pick"));
      b.classList.add("pick");
      setTimeout(() => approve(ev, ev.label), 260);
    };
    g.appendChild(b);
  });
}
function submitSay() {
  const t = $("sayText").value.trim();
  if (!t) { $("sayText").focus(); return; }
  buzz(10);
  unlockAudio();
  $("sayText").blur();
  window.scrollTo(0, 0); /* iOS 收起键盘后页面偶尔不复位 */
  const id = matchEvent(t);
  approve(EVENTS.find(e => e.id === id) || EVENT_MISC, "「" + t + "」");
}
$("sayBtn").onclick = submitSay;
$("sayText").onkeydown = e => { if (e.key === "Enter") submitSay(); };

/* ---------- Stage 2：批准书 ---------- */
function photoHTML(item, cls) {
  const inner = item.img
    ? '<img src="' + item.img + '" alt="' + item.name + '" data-k="' + (item.k || "burger") + '" onerror="window.__svgFallback(this)">'
    : artOf(item.k);
  return '<div class="' + cls + '"><div class="photo-frame">' + inner + "</div></div>";
}
function artOf(k) { return (ART[MEAL_ART[k] || k] || ART.burger)(); }
window.__svgFallback = function (imgEl) {
  const f = imgEl.parentNode;
  if (f) f.innerHTML = artOf(imgEl.dataset.k);
};
/* 菜单图 CDN 偶尔会"卡住"（既不成功也不报错，onerror 不触发），2.5s 没出图就换插画，别留空白圆框 */
function fillFood(box, html) {
  box.innerHTML = html;
  const imgs = [...box.querySelectorAll("img")];
  setTimeout(() => imgs.forEach(i => { if (i.isConnected && !i.naturalWidth) window.__svgFallback(i); }), 2500);
}

function approve(ev, reason) {
  seq.forEach(clearTimeout); seq = [];
  /* 餐品：Skill 注入的实时菜单与券后价优先（仅限注入的那个事件），否则用菜单快照 */
  const inj = !!(D && D.eventId === ev.id && D.meals && D.meals.length);
  const items = inj ? D.meals.slice(0, 2) : ev.meal.map(k => FOOD_DB.find(f => f.k === k));
  const base = items.reduce((s, x) => s + (x.price || 0), 0);
  cur = {
    items,
    names: items.map(x => x.name).join(" + "),
    price: inj && D.finalPrice != null ? D.finalPrice : base,
    kcal: items.every(x => x.kcal != null) ? items.reduce((s, x) => s + x.kcal, 0) : null,
    saved: inj ? D.saved || 0 : 0,
    coupons: inj ? D.couponCount || 0 : 0,
    realMenu: inj && !!D.realMenu
  };
  const d = new Date(), dateStr = d.getFullYear() + "." + (d.getMonth() + 1) + "." + d.getDate();
  $("certNo").textContent = "No." + todayStr() + "-" + (hashStr(ev.id + reason) % 9000 + 1000);
  $("certReason").textContent = reason;
  $("certStars").textContent = "★".repeat(ev.level) + "☆".repeat(5 - ev.level);
  $("certVerdict").textContent = "「" + ((inj && D.verdict) || ev.verdict) + "」";
  fillFood($("certFood"), photoHTML(items[0], "photo-a") + (items[1] ? photoHTML(items[1], "photo-b") : ""));
  $("certMeal").textContent = "批准：" + cur.names;
  $("certMeta").textContent = (cur.kcal != null ? "约 " + cur.kcal + " kcal · " : "") + (cur.realMenu ? "券后 ¥" : "门店价 ¥") + Number(cur.price).toFixed(1);
  $("stampDate").textContent = dateStr;
  $("stamp").classList.remove("hit");
  $("cert").classList.remove("shake");
  $("approveCta").classList.remove("on");
  goTo("approve");
  /* 时序：批准书滑入 → 食物贴上（.45s/.6s）→ 1.1s 落章 → 1.4s 砸中：震屏+闷响+烟花 → 1.7s 出按钮 */
  seq.push(setTimeout(() => $("stamp").classList.add("hit"), 1100));
  seq.push(setTimeout(() => { $("cert").classList.add("shake"); thud(); buzz([12, 60, 12]); launchFireworks(); }, 1400));
  seq.push(setTimeout(() => $("approveCta").classList.add("on"), 1700));
}
$("againBtn").onclick = () => { buzz(8); toAsk(); };

/* 纯 CSS 烟花：从底部升空后炸开，零图片零依赖 */
function launchFireworks() {
  const layer = $("fwLayer");
  const colors = ["#DA291C", "#FFC72C", "#FF7A59", "#FFE08A", "#FFFFFF"];
  const spawn = () => {
    const burst = document.createElement("div");
    burst.className = "fw-burst";
    burst.style.left = (14 + Math.random() * 68) + "%";
    burst.style.setProperty("--peak", (28 + Math.random() * 34) + "vh");
    const n = 12 + Math.floor(Math.random() * 6);
    for (let i = 0; i < n; i++) {
      const s = document.createElement("i");
      const ang = (Math.PI * 2 * i) / n + Math.random() * 0.5;
      const dist = 36 + Math.random() * 46;
      s.style.setProperty("--dx", (Math.cos(ang) * dist).toFixed(1) + "px");
      s.style.setProperty("--dy", (Math.sin(ang) * dist).toFixed(1) + "px");
      s.style.background = colors[i % colors.length];
      s.style.animationDelay = (0.52 + Math.random() * 0.08) + "s";
      burst.appendChild(s);
    }
    layer.appendChild(burst);
    setTimeout(() => burst.remove(), 2000);
  };
  spawn();
  setTimeout(spawn, 180);
  setTimeout(spawn, 380);
}

/* ---------- Stage 3：领券下单 ---------- */
$("goDeal").onclick = () => {
  buzz(12);
  $("dealMeal").textContent = cur.names + (cur.kcal != null ? " · 约 " + cur.kcal + " kcal" : "");
  fillFood($("dealFood"), $("certFood").innerHTML); /* 复用批准书上已出图/已换插画的结果，不重新请求 */
  const row = $("couponRow");
  row.innerHTML = "";
  if (cur.realMenu && cur.coupons > 0) {
    /* 券名用 Skill 注入的真实名字；没给就统称麦麦省券，不编造券种 */
    const names = (D && D.couponNames) || [];
    for (let i = 0; i < Math.min(cur.coupons, 3); i++) {
      const c = document.createElement("div");
      c.className = "coupon";
      c.textContent = (names[i] || "麦麦省券") + " · 已领";
      row.appendChild(c);
    }
  } else {
    const c = document.createElement("div");
    c.className = "coupon";
    c.textContent = "接入 MCP 后自动领取麦麦省券";
    row.appendChild(c);
  }
  $("dealNow").textContent = "¥" + Number(cur.price).toFixed(1);
  $("dealWas").textContent = cur.saved ? "¥" + Number(cur.price + cur.saved).toFixed(1) : "";
  $("dealSave").textContent = cur.saved ? "已省 ¥" + Number(cur.saved).toFixed(1) : "";
  goTo("deal");
};
$("dealUnderlay").onclick = () => goTo("approve");
$("replayBtn").onclick = () => { $("sayText").value = ""; toAsk(); };
$("orderBtn").onclick = () => {
  buzz([15, 50, 15]);
  alert("在 WorkBuddy 里对我说「就吃这个」，我调麦当劳 MCP 帮你领券下单。");
};

/* ---------- 启动：Skill 注入了 eventId 就直接盖章 ---------- */
buildEvents();
if (D && D.eventId) {
  const ev = EVENTS.find(e => e.id === D.eventId) || EVENT_MISC;
  approve(ev, D.reason || ev.label);
}
</script>
</body>
